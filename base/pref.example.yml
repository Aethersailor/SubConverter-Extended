common:
  # API 模式固定开启，令牌认证已移除；调用转换接口时仍需通过 url 参数提供订阅来源。
  # 为兼容旧配置仍会解析此列表；当前 API 模式下 /sub 缺少 url 时不会回退到这里。
  default_url: []
  # 是否把 insert_url 中的节点插入每次转换；关闭后 insert_url 不参与输出。
  enable_insert: true
  # 要插入的订阅来源列表；每项支持本地文件或 URL。
  insert_url: []
  # true 将插入来源置于请求来源之前，并让其节点优先匹配无特定分组限制的规则；false 则追加在后。
  prepend_insert_url: true
  # 按节点名称排除的正则表达式列表；多个表达式任一匹配即排除。取消下一行注释即可启用示例。
  #exclude_remarks: ["(到期|剩余流量|时间|官网|产品)"]
  # 按节点名称保留的正则表达式列表；非空时仅保留至少匹配一个表达式的节点，空列表表示不过滤。
  include_remarks: []
  # 是否启用 JavaScript 节点过滤器；关闭时 filter_script 不会执行。
  enable_filter: false
  # 过滤脚本内容或 path:/path/to/script.js；须定义 filter(node) 并返回真值以保留节点。内联脚本可使用 \n 表示换行。
  filter_script: ""
  # 请求未指定 config 时加载的默认外部配置；支持本地文件或 URL，空值使用程序默认的远程 Custom_OpenClash_Rules 地址。
  default_external_config: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@refs/heads/main/cfg/Custom_Clash.ini"
  # 用户显式选择的 config 失败后，是否允许改用 default_external_config。缺失或 false 时失败请求直接返回错误。
  fallback_to_default_external_config: false
  # 外部配置中 rule_base 可访问的本地文件根目录，也是公开安全档位下的受信任资源根之一。
  base_path: base
  # 各目标格式的基础模板；均支持 base_path 范围内的本地文件或 URL，生成器会在其上写入节点、策略组和规则。
  clash_rule_base: base/all_base.tpl
  surge_rule_base: base/all_base.tpl
  surfboard_rule_base: base/all_base.tpl
  mellow_rule_base: base/all_base.tpl
  quan_rule_base: base/all_base.tpl
  quanx_rule_base: base/all_base.tpl
  loon_rule_base: base/all_base.tpl
  sssub_rule_base: base/all_base.tpl
  singbox_rule_base: base/all_base.tpl
  # Stash 使用独立模板；旧配置缺少此项时仍使用 base/stash.yaml。
  stash_rule_base: base/stash.yaml
  # 分别控制下载外部配置、规则集和订阅时使用的代理。NONE（不区分大小写）和空值强制直连并忽略环境代理；SYSTEM 按系统代理来源解析；显式 http/https/socks4/socks4a/socks5/socks5h URI 不受环境 NO_PROXY 影响，但官方构建会在受信任请求和 lan 模式下直连初始回环主机。
  # socks5 本地解析域名，socks5h 由 SOCKS 服务端解析。cors:https://relay.example/ 是兼容的 HTTP CORS 中继，而不是网络代理。
  proxy_config: SYSTEM
  proxy_ruleset: SYSTEM
  proxy_subscription: NONE
  # proxy_bypass 统一控制上述显式 URI 的直连目标。默认 PRIVATE 覆盖 LOOPBACK、RFC 1918 和 IPv6 ULA；旧配置缺少此字段时也使用该默认值。LAN 额外覆盖链路本地地址、.local 和 .home.arpa；CGNAT 额外覆盖 100.64.0.0/10。也可追加 CIDR:10.200.0.0/16 或 DOMAIN:corp.example。public/strict 的公开请求忽略此旁路。
  proxy_bypass: PRIVATE
  # 广泛覆盖常见内网时可改为 LAN,CGNAT。
  # 是否在节点名称后附加协议类型标签，例如 [SS]、[SSR]、[VMess]。
  append_proxy_type: false
  # 是否在每次 /sub 请求前重新读取本文件；便于热更新，但会增加请求开销并使配置代次变化。
  reload_conf_on_request: false

proxy_provider:
  # 生成 Clash/ClashR proxy-provider 时使用的默认订阅更新间隔，单位为秒；订阅链接中的 interval: 前缀可逐条覆盖。设为 0 时显式生成 interval: 0，关闭 Mihomo 周期更新但保留初次及手动刷新。
  interval: 3600
  # 是否显式生成 proxy: DIRECT；设为 false 时完全省略 proxy 字段，让 Mihomo 按自身规则和模式决定下载路径。订阅链接中的 proxy_direct: 前缀可逐条覆盖。
  proxy_direct: true

custom_openclash_rules:
  # 是否在服务端发起请求前，将可识别的官方 COCR 主分支 GitHub/jsDelivr 取源地址切换到 git.asailor.org。不会改写生成结果中的 URL。
  fallback_enabled: false

userinfo:
  # 从节点名称提取流量信息的规则，按顺序匹配；match 为完整正则，replace 使用 total/left/used=$n 的查询串格式。
  stream_rule: 
  - {match: "^剩余流量：(.*?)\\|总流量：(.*)$", replace: "total=$2&left=$1"}
  - {match: "^剩余流量：(.*?) (.*)$", replace: "total=$1&left=$2"}
  - {match: "^Bandwidth: (.*?)/(.*)$", replace: "used=$1&total=$2"}
  - {match: "^.*剩余(.*?)(?:\\s*?)@(?:.*)$", replace: "total=$1"}
  - {match: "^.*?流量:(.*?) 剩:(?:.*)$", replace: "total=$1"}
  # 从节点名称提取到期信息的规则，按顺序匹配；绝对时间替换格式为 yyyy:mm:dd:hh:mm:ss，相对剩余时间使用 left=<数值>d。
  time_rule:
  - {match: "^过期时间：(\\d+)-(\\d+)-(\\d+) (\\d+):(\\d+):(\\d+)$", replace: "$1:$2:$3:$4:$5:$6"}
  - {match: "^到期时间(:|：)(\\d+)-(\\d+)-(\\d+)$", replace: "$1:$2:$3:0:0:0"}
  - {match: "^Smart Access expire: (\\d+)/(\\d+)/(\\d+)$", replace: "$1:$2:$3:0:0:0"}
  - {match: "^.*?流量:(?:.*?) 剩:(.*?)天$", replace: "left=$1d"}

node_pref:
  # 可选的三态覆盖：取消注释后强制所有输出节点启用或禁用 UDP、TCP Fast Open、跳过证书校验或 TLS 1.3；保持注释则沿用节点原值。
#  udp_flag: false
#  tcp_fast_open_flag: false
#  skip_cert_verify_flag: false
#  tls13_flag: false
  # 是否按名称排序节点；启用后使用 sort_script（如已配置），否则使用内置排序行为。
  sort_flag: false
  # 内联 JavaScript 或 path:/path/to/script.js；定义 compare(node_a, node_b) 作为节点比较器。
  sort_script: ""
  # 是否过滤已弃用或不再推荐的节点类型/配置。
  filter_deprecated_nodes: false
  # 是否把上游 Subscription-UserInfo 流量/到期信息附加到生成响应头。
  append_sub_userinfo: true
  # Clash 输出是否使用新字段名（如 proxy-groups、rules）；关闭时兼容旧字段名。
  clash_use_new_field_name: true
  # Clash 节点列表的 YAML 样式：block、flow 或 compact。
  clash_proxies_style: flow
  # 当前版本保留的兼容字段；偏好设置读取器尚未应用它，策略组样式仍使用程序内置值。
  clash_proxy_groups_style: flow
  # 是否为 sing-box 规则加入 Clash 模式，并在 outbounds 末尾添加 GLOBAL 出站组。
  singbox_add_clash_modes: true
  # 节点重命名规则，按顺序执行：match/replace 为正则替换，script 为脚本，import 导入外部规则文件。
  rename_node:
#  - {match: "\\(?((x|X)?(\\d+)(\\.?\\d+)?)((\\s?倍率?)|(x|X))\\)?", replace: "$1x"}
#  - {script: "function rename(node){}"}
#  - {script: "path:/path/to/script.js"}
  - {import: snippets/rename_node.txt}

managed_config:
  # 是否在 Surge 与 Surfboard 输出中写入 #!MANAGED-CONFIG 元信息。
  write_managed_config: true
  # MANAGED-CONFIG 与 /getruleset、/qx-rewrite、/qx-script 生成地址的服务前缀，不含末尾斜杠。
  managed_config_prefix: "http://127.0.0.1:25500"
  # 托管配置建议更新间隔，单位秒；Surfboard 要求至少 900 秒。
  config_update_interval: 86400
  # true 时 Surge 在超过更新间隔后要求强制更新；false 仅按普通托管配置更新。
  config_update_strict: false
  # 写入部分 Quantumult X 重写脚本的设备 ID；不需要时留空。
  quanx_device_id: ""

surge_external_proxy:
  # Surge 输出使用 SSR 外部代理时的 ssr-local 可执行文件路径；留空表示不指定。
  surge_ssr_path: "" # /usr/bin/ssr-local
  # 是否在生成 Surge 外部代理配置时解析服务器主机名。
  resolve_hostname: true

remote_subscription:
  # Surge 完整配置默认使用 policy-path 让客户端直接更新兼容的远程订阅；设为 false 可强制保留服务端 Legacy 解析。
  surge_policy_path: true
  # Surfboard 完整配置默认使用独立的 policy-path 路径；设为 false 可强制保留服务端 Legacy 解析。
  surfboard_policy_path: true
  # Loon 完整配置默认使用 Remote Proxy 让客户端直接读取远程订阅；设为 false 可强制保留服务端 Legacy 解析。
  loon_remote_proxy: true

singbox:
  # 新配置使用 sing-box 1.11+ WireGuard endpoint；旧配置缺少本节时仍保持旧 outbound 输出。
  wireguard_endpoint: true
  # sing-box 1.14+ 才支持 Snell outbound；当前稳定版尚不支持，因此默认关闭。
  snell_outbound: false

security:
  # 安全档位：lan 保留局域网兼容行为并允许本地/私网/fake-ip 资源；public 限制公开请求控制的不受信任抓取；strict 另行强制禁止公开上传。
  # 环境变量 SUBCONVERTER_SECURITY_PROFILE=lan|public|strict 优先于文件；无效值为兼容旧部署仍回退到 lan，并输出 SECURITY_PROFILE_INVALID_FALLBACK 告警，不代表适合公网暴露。
  # SUBCONVERTER_SECURITY_PROFILE=lan|public|strict overrides the file; invalid values still fall back to lan for compatibility and emit SECURITY_PROFILE_INVALID_FALLBACK, which does not imply Internet-safe exposure.
  profile: lan
  # 仅决定 public 档位是否允许公开上传；lan 始终保留旧上传行为，strict 始终禁止。环境变量 SUBCONVERTER_ALLOW_PUBLIC_UPLOAD 优先。
  allow_public_upload: false

statistics:
  # 是否启用隐私友好的运行统计以及 /dashboard、/dashboard/data；关闭时不启用统计请求处理。
  enabled: false
  # 统计持久化目录；容器部署如需重启后保留数据，应把此目录挂载到持久卷。
  data_dir: stats
  # 两次持久化写入之间的最短秒数；越小数据越及时，但磁盘写入更频繁。
  flush_interval: 5
  geo:
    # 地理来源：header 从受信任边缘注入的国家/地区请求头统计且不保存 IP；none 将所有访问记为未知。
    provider: header
    # 按顺序查找国家代码的请求头名称；只应信任由反向代理/CDN 清洗并覆盖的请求头。
    country_headers: ["CF-IPCountry", "X-Geo-Country", "X-Vercel-IP-Country", "CloudFront-Viewer-Country"]
    # 中国省级统计使用的地区代码请求头，按顺序查找；同样必须来自受信任边缘。
    china_region_headers: ["CF-Region-Code", "cf-region-code", "X-Geo-Subdivision"]
  dashboard_auth:
    # 是否为 /dashboard 与 /dashboard/data 启用 HTTP Basic 认证；仅在 statistics.enabled=true 时有意义。
    enabled: false
    # Basic 认证用户名；启用认证时应设置非空值。
    username: ""
    # Basic 认证密码；请使用强密码并避免提交真实凭据。
    password: ""
    # window_seconds 窗口内允许的失败次数下限；达到后锁定 lock_seconds。三个数值小于 1 时都会被收敛为 1。
    max_failures: 5
    window_seconds: 300
    lock_seconds: 900
    client_ip:
      # 默认 none：只按 TCP socket peer 分桶；仅在明确的可信代理会覆盖/清洗所选头时启用。
      # 可选值：none、x-forwarded-for、forwarded、x-real-ip、cf-connecting-ip、true-client-ip。
      header: none
      # 必须使用 CIDR，最多 64 项，且不允许 IPv4/IPv6 的 /0。
      trusted_proxy_cidrs: []

emojis:
  # 是否按 rules 为节点名称添加 Emoji。
  add_emoji: false
  # 添加新 Emoji 前是否移除节点名称中已有的 Emoji；启用节点预处理时，Quantumult X 远程订阅会保留 Legacy 路径。
  remove_old_emoji: false
  # Emoji 规则按顺序处理：match/emoji 为正则映射，script 为脚本，import 导入规则文件。
  rules:
#  - {match: "(流量|时间|应急)", emoji: "🏳️‍🌈"}
#  - {script: "function getEmoji(node){}"}
#  - {script: "path:/path/to/script.js"}
  - {import: snippets/emoji.txt}

rulesets:
  # 是否启用规则集下载与规则生成；关闭时 overwrite_original_rules 和 update_ruleset_on_request 也会被强制关闭。
  enabled: true
  # 是否用生成的规则覆盖基础模板已有规则；false 保留原规则并追加生成结果。
  overwrite_original_rules: true
  # 是否每次请求都更新规则集；false 使用启动/配置加载时取得的内容以及缓存策略。
  update_ruleset_on_request: false
  # 规则项字段：rule 表示内联规则；ruleset 表示本地文件或 URL；group 为目标策略组；interval 为更新秒数；可用 surge/quanx/clash-domain/clash-ipcidr/clash-classic 类型前缀。
  rulesets:
#  - {rule: "GEOIP,CN", group: "DIRECT"}
#  - {ruleset: "https://example.com/rules/lan.list", group: "DIRECT"}
#  - {ruleset: "surge:https://example.com/rules/lan.list", group: "DIRECT"}
#  - {ruleset: "quanx:https://example.com/rules/advertising.list", group: "Advertising", interval: 86400}
#  - {ruleset: "clash-domain:https://ruleset.dev/clash_domestic_services_domains", group: "Domestic Services", interval: 86400}
#  - {ruleset: "clash-ipcidr:https://ruleset.dev/clash_domestic_services_ips", group: "Domestic Services", interval: 86400}
#  - {ruleset: "clash-ipcidr:https://example.com/cn-ip.yaml", group: "🎯 全球直连", interval: 28800, options: ["no-resolve"]}
#  - {ruleset: "clash-classic:https://example.com/rules/direct.yaml", group: "DIRECT", interval: 86400}
  - {import: snippets/rulesets.txt}

proxy_groups:
  # 自定义策略组列表。name/type 定义组；rule 支持正则、[]字面成员及 !!GROUP/!!GROUPID/!!PROVIDER；测试类组还可设 url、interval、timeout、tolerance；import 导入外部列表。
  custom_proxy_group:
#  - {name: UrlTest, type: url-test, rule: [".*"], url: http://www.gstatic.com/generate_204, interval: 300, tolerance: 100, timeout: 5}
#  - {name: Proxy, type: select, rule: [".*"]}
#  - {name: group1, type: select, rule: ["!!GROUPID=0"]}
#  - {name: v2ray, type: select, rule: ["!!GROUP=V2RayProvider"]}
#  - {import: snippets/groups_forcerule.txt}
#  - {name: ssid group, type: ssid, rule: ["default_group", "celluar=group0,ssid1=group1,ssid2=group2"]}
  - {import: snippets/groups.txt}

template:
  # 模板 include 语句可访问的本地根目录；空值交由默认模板查找行为处理。
  template_path: ""
  # 注入模板 global 作用域的键值；例如 clash.http_port 可在模板中以 global.clash.http_port 访问。值在加载时转为字符串。
  globals:
  - {key: clash.http_port, value: 7890}
  - {key: clash.socks_port, value: 7891}
  - {key: clash.allow_lan, value: true}
  - {key: clash.log_level, value: info}
  - {key: clash.external_controller, value: '127.0.0.1:9090'}
  - {key: singbox.allow_lan, value: true}
  - {key: singbox.mixed_port, value: 2080}

aliases:
  # 接口别名列表：uri 为短路径，target 为实际路径与查询串；访问别名时附带的请求参数会继续传给目标。
  - {uri: /v, target: /version}
  - {uri: /clash, target: "/sub?target=clash"}
  - {uri: /clashr, target: "/sub?target=clashr"}
  - {uri: /surge, target: "/sub?target=surge"}
  - {uri: /quan, target: "/sub?target=quan"}
  - {uri: /quanx, target: "/sub?target=quanx"}
  - {uri: /mellow, target: "/sub?target=mellow"}
  - {uri: /surfboard, target: "/sub?target=surfboard"}
  - {uri: /loon, target: "/sub?target=loon"}
  - {uri: /singbox, target: "/sub?target=singbox"}
  - {uri: /ss, target: "/sub?target=ss"}
  - {uri: /ssd, target: "/sub?target=ssd"}
  - {uri: /sssub, target: "/sub?target=sssub"}
  - {uri: /ssr, target: "/sub?target=ssr"}
  - {uri: /v2ray, target: "/sub?target=v2ray"}
  - {uri: /trojan, target: "/sub?target=trojan"}

tasks:
  # 定时 JavaScript 任务列表：name 为任务名，cronexp 使用 Quartz 风格 Cron，path 为脚本路径，timeout 为执行超时秒数；空列表不启用调度。
#  - name: tick
#    cronexp: "0/10 * * * * ?"
#    path: tick.js
#    timeout: 3

server:
  # Web 服务监听地址；0.0.0.0 监听所有 IPv4 接口，但不等于已暴露公网。启动日志会报告“可能暴露/公网可达性未知”；若确认公网可达，请配合 public/strict 和反向代理访问控制。
  listen: 0.0.0.0
  # Web 服务监听端口；PORT 环境变量存在时优先于本值。
  port: 25500
  # 静态文件根目录并挂载到 /；设为空字符串可关闭静态文件服务。
  serve_file_root: web

advanced:
  # 日志级别：info、warn、error、fatal、verbose 或 debug；未知值按 info 处理。
  log_level: info
  # 是否强制输出详细调试信息；true 会覆盖 log_level 并使用 verbose 级别，可能包含敏感配置细节。
  print_debug_info: false
  # 资源控制模式：默认 Beast 后端下，compat 使用同步有界转换路径，adaptive 和 force_max 使用协作式异步路径；显式 httplib 后端始终使用同步兼容路径。force_max 仅在硬件探测和可选硬件 pin 通过时应用硬件感知的启动预算，否则回退到 compat。未知值会拒绝启动。
  resource_control: compat
  # 已弃用的可选硬件 pin。留空时不固定硬件；填写后仅在精确匹配时启用 force_max。该值不代表已验证容量曲线。
  force_max_curve_fingerprint: ""
  # 普通模式的 HTTP 等待队列上限；force_max 会忽略此静态值，按可用内存和文件描述符上限计算。
  max_pending_connections: 10240
  # HTTP 基础工作线程数；SUBCONVERTER_MAX_CONCURRENT_THREADS 可覆盖，最小会收敛为 1。
  max_concurrent_threads: 16
  # cpp-httplib 后端在突发流量下的动态工作线程总上限；必须不小于基础线程数，否则会自动提高。SUBCONVERTER_MAX_SERVER_THREADS 可覆盖。
  max_server_threads: 128
  # 整个 HTTP 请求的绝对截止时间，单位毫秒；所有资源模式使用同一有限截止时间。SUBCONVERTER_REQUEST_DEADLINE_MS 可覆盖，允许范围 100～300000。
  request_deadline_ms: 15000
  # 单次配置允许的规则集数量上限；0 表示不限制。
  max_allowed_rulesets: 64
  # 转换时允许生成的规则数量上限；0 表示不限制。
  max_allowed_rules: 0
  # 单次远程下载允许的字节数上限；0 表示不限制。过大值会增加内存与带宽风险。
  max_allowed_download_size: 0
  # 是否启用订阅、配置和规则集的磁盘缓存；关闭后下列三个 TTL 都按 0 处理。
  enable_cache: true
  # 订阅下载缓存有效期，单位秒；0 表示不缓存。
  cache_subscription: 60
  # 外部配置及通用配置资源缓存有效期，单位秒；0 表示不缓存。
  cache_config: 300
  # 规则集下载缓存有效期，单位秒；0 表示不缓存。
  cache_ruleset: 21600
  # 每次执行后是否清理脚本上下文；更隔离但可能失去跨请求脚本状态。
  script_clean_context: true
  # 是否并行抓取多个规则集；可降低生成延迟，但会增加瞬时连接与资源占用。
  async_fetch_ruleset: true
  # 多订阅转换中某个链接失败时是否跳过并继续；false 会让失败影响整次转换。
  skip_failed_links: true
  # 是否合并内容相同的并发 GET /sub 请求，让它们共享一次转换结果；上传请求不会参与合并。SUBCONVERTER_DISABLE_COALESCING=true 可关闭。
  enable_request_coalescing: true
  # 合并请求首次得到 5xx 时是否在服务端内部重试一次；SUBCONVERTER_COALESCE_RETRY_ON_5XX 可覆盖。
  coalesce_retry_on_5xx: true
  # 默认验证远程 TLS 证书。仅在受控兼容场景临时设为 true；不要把它作为网络错误的常规修复手段。
  allow_insecure_tls: false
  # 符合请求合并条件且未启用 Age 加密的 200 /sub 响应微缓存秒数；0 关闭，正值最大收敛为 5。SUBCONVERTER_RESPONSE_CACHE_TTL 可覆盖。
  response_cache_ttl: 0
