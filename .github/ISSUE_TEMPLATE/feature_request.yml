name: 功能建议
description: 说明当前需求、使用场景和期望行为
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [README](https://github.com/Aethersailor/SubConverter-Extended/blob/master/README.md)、[Wiki](https://github.com/Aethersailor/SubConverter-Extended/wiki) 并检索现有 Issue。请描述需求和用户影响，不必预先确定实现方案。

        不要粘贴真实订阅 URL、节点凭据、Token、Cookie 或私有配置。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认当前正式 Release 和 Wiki 没有提供等价能力。
          required: true
        - label: 我已检索现有 Issue，没有找到相同建议。
          required: true
        - label: 我已删除或替换所有敏感信息。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 需求与影响
      description: 说明需要完成什么、当前行为造成什么限制，以及受影响的目标格式或客户端。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 描述对用户可见的输入、输出、默认值和失败条件。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方式（可选）
      description: 说明已尝试的参数、模板、客户端原生能力或其他工具，以及它们为何不适用。
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与安全考量（可选）
      description: 如果建议会改变现有输出、远程访问、隐私边界或资源消耗，请说明预期影响。
