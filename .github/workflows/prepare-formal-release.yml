name: Prepare Formal Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "确认推进 master 并创建正式发布标签"
        type: boolean
        required: true
        default: false
      version:
        description: "版本号。留空时将最新 vX.Y.Z 的修订号加一，也可填写未使用的 vX.Y.Z。"
        required: false
        type: string

concurrency:
  group: sync-dev-to-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/dev' && inputs.confirm_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: master
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Resolve dev and release request
        id: request
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/dev:refs/remotes/origin/dev"
          DEV_SHA="$(git rev-parse origin/dev)"
          VERSION="${REQUESTED_VERSION:-}"
          VERSION="${VERSION#"${VERSION%%[![:space:]]*}"}"
          VERSION="${VERSION%"${VERSION##*[![:space:]]}"}"

          git fetch --tags origin
          if [ -z "$VERSION" ]; then
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                major="${BASH_REMATCH[1]}"
                minor="${BASH_REMATCH[2]}"
                patch="${BASH_REMATCH[3]}"
                VERSION="v${major}.${minor}.$((10#$patch + 1))"
                echo "未填写版本号：基于 $candidate 自动使用 $VERSION。"
                break
              fi
            done < <(git tag --list 'v*' --sort=-version:refname)

            if [ -z "$VERSION" ]; then
              echo "::error::未找到可用于递增的 vX.Y.Z 标签，请手动填写版本号。"
              exit 1
            fi
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::请填写未使用的 vX.Y.Z 版本号。"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null || \
             git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::标签 $VERSION 已存在。"
            exit 1
          fi

          echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Merge dev and push the version tag
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
          DEV_SHA: ${{ steps.request.outputs.dev_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git merge-base --is-ancestor "$DEV_SHA" HEAD; then
            if ! git merge "$DEV_SHA" --no-commit --no-ff; then
              git rev-parse --verify MERGE_HEAD >/dev/null
              description_workflow=.github/workflows/sync-dockerhub-description.yml
              if [ -n "$(git diff --name-only --diff-filter=U -- "$description_workflow")" ]; then
                git checkout --theirs -- "$description_workflow"
                git add -- "$description_workflow"
              fi
            fi

            git rm -f --ignore-unmatch -- ':(top,glob)README*.md' ':(top,glob)docs/images/readme-flow-*.svg'
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -n "$unresolved" ]; then
              printf '::error::Merge conflicts require manual resolution:\n%s\n' "$unresolved"
              git merge --abort
              exit 1
            fi

            git commit -m "chore: sync dev to master"
          fi

          MASTER_SHA="$(git rev-parse HEAD)"
          git tag -a "$VERSION" "$MASTER_SHA" -m "Release $VERSION"
          git push --atomic origin "HEAD:refs/heads/master" "refs/tags/$VERSION"

          echo "Prepared $VERSION from dev $DEV_SHA at master $MASTER_SHA."
