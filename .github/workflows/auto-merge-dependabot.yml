name: Merge Dependabot PRs into dev

on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize, ready_for_review, labeled, edited]
  push:
    branches: [dev]
  workflow_run:
    workflows: [Build and Push Docker image]
    branches: [dev]
    types: [completed]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect the dev queue without making changes
        type: boolean
        default: false
      refresh_dependencies:
        description: Request the automatic upstream refresh on dev when due
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-maintenance-dev
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/dev') &&
      (github.event_name != 'pull_request_target' ||
        (github.event.pull_request.base.ref == 'dev' &&
         github.event.pull_request.user.login == 'dependabot[bot]' &&
         github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.head_branch == 'dev' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Read only trusted dev maintenance code, never a dependency PR checkout.
      - name: Checkout trusted dev maintenance code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: dev
          persist-credentials: false

      - name: Merge dev dependency updates and reconcile dev builds
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          AUTOMERGE_MODE: ${{ vars.DEPENDABOT_AUTOMERGE_MODE || 'active' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          REFRESH_DEPENDENCIES: ${{ inputs.refresh_dependencies || false }}
          # Only official Dependabot rebase requests use this credential.
          REBASE_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          github-token: ${{ github.token }}
          script: |
            await require('./.github/scripts/dependabot-maintenance.cjs')({github, context, core});
