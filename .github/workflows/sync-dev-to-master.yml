name: Sync Dev to Master

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Release mode: new creates a tag, overwrite rebuilds an existing release, sync_only only syncs branches."
        required: true
        default: "new"
        type: choice
        options:
          - new
          - overwrite
          - sync_only
      version:
        description: "Release tag, e.g. v1.2.3. Empty auto bumps for new or uses latest existing tag for overwrite."
        required: false
        type: string
      confirm_overwrite:
        description: "Type OVERWRITE to confirm rebuilding an existing release."
        required: false
        type: string

concurrency:
  group: sync-dev-to-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Dev into Master
        id: sync
        run: |
          set -euo pipefail

          echo "Merging dev into master..."
          # Attempt merge; if it fails (conflicts), continue execution to resolve them
          if ! git merge origin/dev --no-commit --no-ff; then
            echo "Merge conflicts detected, resolving..."
            
            # Get list of conflicting files
            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)
            
            for file in $CONFLICTED_FILES; do
              if [[ "$file" == README*.md || "$file" == docs/images/readme-flow-*.svg ]]; then
                # For README files and their diagram assets, keep master version
                echo "Keeping master version of $file"
                git checkout --ours "$file"
              else
                # For other files (code, workflows), use dev version
                echo "Using dev version of $file"
                git checkout --theirs "$file"
              fi
              git add "$file"
            done
          fi
          
          echo "Restoring master README and diagram assets..."
          # Restore README.md and its diagram assets from HEAD (master) state, discarding changes from dev
          git checkout HEAD -- README.md 2>/dev/null || true
          git checkout HEAD -- 'README-*.md' 2>/dev/null || true
          git checkout HEAD -- 'docs/images/readme-flow-*.svg' 2>/dev/null || true
          
          # Re-add README files and diagram assets to staging if they were modified
          git add README.md 2>/dev/null || true
          git add README-*.md 2>/dev/null || true
          git add docs/images/readme-flow-*.svg 2>/dev/null || true
          
          # Commit whenever a merge is in progress, even if protected docs made
          # the final tree identical to master. This records dev as merged.
          if [ -f .git/MERGE_HEAD ]; then
            echo "Committing merge..."
            git commit -m "chore: sync dev to master"
            echo "Pushing..."
            git push origin master
          elif git diff --staged --quiet; then
            echo "No changes to commit (maybe dev is already merged or only protected docs changed)"
          else
            echo "Committing..."
            git commit -m "chore: sync dev to master"
            echo "Pushing..."
            git push origin master
          fi

          MASTER_COMMIT="$(git rev-parse HEAD)"
          echo "master_commit=$MASTER_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Master commit selected for downstream work: $MASTER_COMMIT"

      - name: Resolve Release Tag
        id: release_tag
        if: ${{ inputs.release_mode != 'sync_only' }}
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          REQUESTED_VERSION: ${{ inputs.version }}
          CONFIRM_OVERWRITE: ${{ inputs.confirm_overwrite }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          REQUESTED_VERSION="${REQUESTED_VERSION:-}"
          REQUESTED_VERSION="${REQUESTED_VERSION#"${REQUESTED_VERSION%%[![:space:]]*}"}"
          REQUESTED_VERSION="${REQUESTED_VERSION%"${REQUESTED_VERSION##*[![:space:]]}"}"

          if [ "$RELEASE_MODE" = "overwrite" ] && [ "${CONFIRM_OVERWRITE:-}" != "OVERWRITE" ]; then
            echo "::error::confirm_overwrite must be exactly 'OVERWRITE' when release_mode=overwrite."
            exit 1
          fi

          if [ -n "$REQUESTED_VERSION" ]; then
            TAG_NAME="$REQUESTED_VERSION"
            if [[ "$TAG_NAME" != v* ]]; then
              TAG_NAME="v$TAG_NAME"
            fi
            echo "Using manually requested release tag: $TAG_NAME"
          else
            LATEST_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

            if [ -z "$LATEST_TAG" ]; then
              if [ "$RELEASE_MODE" = "new" ]; then
                TAG_NAME="v0.1.0"
                echo "No existing vX.Y.Z tag found. Starting at $TAG_NAME"
              else
                echo "::error::No existing vX.Y.Z tag found to overwrite."
                exit 1
              fi
            else
              if [ "$RELEASE_MODE" = "new" ]; then
                VERSION="${LATEST_TAG#v}"
                IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
                TAG_NAME="v${MAJOR}.${MINOR}.$((PATCH + 1))"
                echo "Auto bumped release tag from $LATEST_TAG to $TAG_NAME"
              else
                TAG_NAME="$LATEST_TAG"
                echo "No release tag requested. Using latest existing release tag: $TAG_NAME"
              fi
            fi
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$TAG_NAME'. Use vX.Y.Z, for example v1.2.3."
            exit 1
          fi

          if [ "$RELEASE_MODE" = "new" ]; then
            if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
              echo "::error::Tag '$TAG_NAME' already exists locally."
              exit 1
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG_NAME' already exists on origin."
              exit 1
            fi
          else
            if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
              echo "::error::Tag '$TAG_NAME' does not exist locally."
              exit 1
            fi

            if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG_NAME' does not exist on origin."
              exit 1
            fi

            TAG_COMMIT="$(git rev-list -n 1 "$TAG_NAME")"
            MASTER_COMMIT="$(git rev-parse HEAD)"
            echo "Overwrite release tag: $TAG_NAME"
            echo "Tag commit: $TAG_COMMIT"
            echo "Master commit used for rebuilt assets: $MASTER_COMMIT"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create and Push Release Tag
        if: ${{ inputs.release_mode == 'new' }}
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        run: |
          set -euo pipefail

          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Dispatch and Verify Master Build
        if: ${{ inputs.release_mode == 'overwrite' || inputs.release_mode == 'sync_only' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
          EXPECTED_SHA: ${{ steps.sync.outputs.master_commit }}
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          run_id=""

          for attempt in 1 2 3 4 5; do
            branch_visible=false
            for visibility_attempt in 1 2 3 4 5 6; do
              visible_sha="$(gh api "repos/$repo/branches/master" --jq '.commit.sha')"
              if [ "$visible_sha" = "$EXPECTED_SHA" ]; then
                branch_visible=true
                break
              fi

              echo "Waiting for GitHub API to expose master at $EXPECTED_SHA (currently $visible_sha)..."
              sleep 2
            done

            if [ "$branch_visible" != "true" ]; then
              echo "::warning::GitHub API did not expose master at $EXPECTED_SHA before dispatch attempt $attempt."
              sleep "$((attempt * 2))"
              continue
            fi

            dispatch_args=(--ref master)
            if [ "$RELEASE_MODE" = "overwrite" ]; then
              dispatch_args+=(
                -f "release_tag=$TAG_NAME"
                -f overwrite_existing_release=true
              )
            fi

            dispatch_output="$(gh workflow run build-dockerhub.yml "${dispatch_args[@]}")"
            printf '%s\n' "$dispatch_output"
            candidate_run_id="$(
              printf '%s\n' "$dispatch_output" |
                sed -n 's#^.*/actions/runs/\([0-9][0-9]*\).*$#\1#p' |
                tail -n 1
            )"

            if [ -z "$candidate_run_id" ]; then
              echo "::warning::Could not determine the dispatched workflow run ID on attempt $attempt."
              sleep "$((attempt * 2))"
              continue
            fi

            dispatched_sha="$(gh run view "$candidate_run_id" --repo "$repo" --json headSha --jq '.headSha')"
            if [ "$dispatched_sha" = "$EXPECTED_SHA" ]; then
              run_id="$candidate_run_id"
              echo "Dispatched build run $run_id for expected master SHA $EXPECTED_SHA."
              break
            fi

            echo "::warning::Dispatched run $candidate_run_id resolved stale master SHA $dispatched_sha; expected $EXPECTED_SHA."
            gh run watch "$candidate_run_id" --repo "$repo" --exit-status || true
            sleep "$((attempt * 2))"
          done

          if [ -z "$run_id" ]; then
            echo "::error::Failed to dispatch build-dockerhub.yml for master SHA $EXPECTED_SHA after 5 attempts."
            exit 1
          fi

          gh run watch "$run_id" --repo "$repo" --exit-status

          jobs_file="$(mktemp)"
          trap 'rm -f "$jobs_file"' EXIT
          gh run view "$run_id" --repo "$repo" --json jobs > "$jobs_file"

          python3 - "$jobs_file" "$RELEASE_MODE" <<'PY'
          import json
          import sys

          jobs_path, release_mode = sys.argv[1:]
          with open(jobs_path, encoding="utf-8") as handle:
              jobs = {
                  job["name"]: job["conclusion"]
                  for job in json.load(handle)["jobs"]
              }

          required = [
              "🧭 Verify Current Source Head",
              "🔧 Prepare Metadata",
              "🐳 Docker Build (amd64)",
              "🐳 Docker Build (arm64)",
              "🐳 Docker Build (armv7)",
          ]
          if release_mode == "overwrite":
              required.extend(
                  [
                      "🪟 Windows Build (amd64)",
                      "🔗 Promote Docker Images",
                      "🚀 Release Artifacts",
                  ]
              )

          failures = [
              f"{name}: {jobs.get(name, 'missing')}"
              for name in required
              if jobs.get(name) != "success"
          ]
          if failures:
              print(
                  "::error::Required downstream jobs did not succeed: "
                  + "; ".join(failures)
              )
              raise SystemExit(1)

          print("Verified required downstream jobs: " + ", ".join(required))
          PY

          if [ "$RELEASE_MODE" = "overwrite" ]; then
            echo "Rebuilt release $TAG_NAME from master SHA $EXPECTED_SHA in run $run_id."
          else
            echo "Synced dev to master at $EXPECTED_SHA and verified master build run $run_id."
          fi
