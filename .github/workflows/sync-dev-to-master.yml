name: Sync Dev to Master

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "操作类型：sync_only 仅同步 dev；new 同步 dev 并创建发布标签。"
        required: true
        default: sync_only
        type: choice
        options:
          - sync_only
          - new
      version:
        description: "版本号（仅用于 new）：可留空以自动递增最新 vX.Y.Z 的最后一位，或填写未使用的版本号。"
        required: false
        type: string

concurrency:
  group: sync-dev-to-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: master
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Resolve dev and release request
        id: request
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/dev:refs/remotes/origin/dev"
          DEV_SHA="$(git rev-parse origin/dev)"
          VERSION="${REQUESTED_VERSION:-}"
          VERSION="${VERSION#"${VERSION%%[![:space:]]*}"}"
          VERSION="${VERSION%"${VERSION##*[![:space:]]}"}"

          if [ "$OPERATION" = "new" ]; then
            git fetch --tags origin
            if [ -z "$VERSION" ]; then
              while IFS= read -r candidate; do
                if [[ "$candidate" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                  major="${BASH_REMATCH[1]}"
                  minor="${BASH_REMATCH[2]}"
                  patch="${BASH_REMATCH[3]}"
                  VERSION="v${major}.${minor}.$((10#$patch + 1))"
                  echo "未填写版本号：基于 $candidate 自动使用 $VERSION。"
                  break
                fi
              done < <(git tag --list 'v*' --sort=-version:refname)

              if [ -z "$VERSION" ]; then
                echo "::error::未找到可用于递增的 vX.Y.Z 标签，请手动填写版本号。"
                exit 1
              fi
            fi

            if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::new 需要未使用的 vX.Y.Z 版本号。"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null || \
               git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
              echo "::error::标签 $VERSION 已存在。"
              exit 1
            fi
          elif [ -n "$VERSION" ]; then
            echo "::error::sync_only 不得填写版本号。"
            exit 1
          fi

          echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Merge dev and push
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          VERSION: ${{ steps.request.outputs.version }}
          DEV_SHA: ${{ steps.request.outputs.dev_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git merge-base --is-ancestor "$DEV_SHA" HEAD; then
            if ! git merge "$DEV_SHA" --no-commit --no-ff; then
              while IFS= read -r file; do
                if [[ "$file" == .github/workflows/sync-dockerhub-description.yml ]]; then
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                elif [[ "$file" == README*.md || "$file" == docs/images/readme-flow-*.svg ]]; then
                  if git cat-file -e "HEAD:$file" 2>/dev/null; then
                    git checkout --ours -- "$file"
                    git add -- "$file"
                  else
                    git rm --ignore-unmatch -- "$file"
                  fi
                fi
              done < <(git diff --name-only --diff-filter=U)

              unresolved="$(git diff --name-only --diff-filter=U)"
              if [ -n "$unresolved" ]; then
                printf '::error::Merge conflicts require manual resolution:\n%s\n' "$unresolved"
                git merge --abort
                exit 1
              fi
            fi

            master_tree="$(mktemp)"
            git ls-tree -rz --name-only HEAD > "$master_tree"
            master_docs=()
            while IFS= read -r -d '' file; do
              if [[ "$file" == README*.md || "$file" == docs/images/readme-flow-*.svg ]]; then
                master_docs+=("$file")
              fi
            done < "$master_tree"
            rm -f "$master_tree"
            if [ "${#master_docs[@]}" -gt 0 ]; then
              git restore --source=HEAD --staged --worktree -- "${master_docs[@]}"
            fi
            git commit -m "chore: sync dev to master"
          fi

          MASTER_SHA="$(git rev-parse HEAD)"
          if [ "$OPERATION" = "new" ]; then
            git tag -a "$VERSION" "$MASTER_SHA" -m "Release $VERSION"
            git push --atomic origin "HEAD:refs/heads/master" "refs/tags/$VERSION"
          else
            git push origin "HEAD:refs/heads/master"
          fi

          echo "Synced dev $DEV_SHA to master $MASTER_SHA."
