name: Sync Dev to Master

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "new merges dev and creates a release tag; sync_only only merges dev."
        required: true
        default: sync_only
        type: choice
        options:
          - sync_only
          - new
      version:
        description: "Required for new. Use an unused version such as v1.4.0."
        required: false
        type: string

concurrency:
  group: sync-dev-to-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: master
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Resolve dev and release request
        id: request
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/dev:refs/remotes/origin/dev"
          DEV_SHA="$(git rev-parse origin/dev)"
          VERSION="${REQUESTED_VERSION:-}"
          VERSION="${VERSION#"${VERSION%%[![:space:]]*}"}"
          VERSION="${VERSION%"${VERSION##*[![:space:]]}"}"

          if [ "$OPERATION" = "new" ]; then
            if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::new requires an unused vX.Y.Z version."
              exit 1
            fi
            git fetch --tags origin
            if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null || \
               git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
              echo "::error::Tag $VERSION already exists."
              exit 1
            fi
          elif [ -n "$VERSION" ]; then
            echo "::error::sync_only must not include a version."
            exit 1
          fi

          echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Merge dev and push
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          VERSION: ${{ steps.request.outputs.version }}
          DEV_SHA: ${{ steps.request.outputs.dev_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git merge-base --is-ancestor "$DEV_SHA" HEAD; then
            if ! git merge "$DEV_SHA" --no-commit --no-ff; then
              while IFS= read -r file; do
                if [[ "$file" == README*.md || "$file" == docs/images/readme-flow-*.svg ]]; then
                  git checkout --ours -- "$file"
                  git add -- "$file"
                fi
              done < <(git diff --name-only --diff-filter=U)

              unresolved="$(git diff --name-only --diff-filter=U)"
              if [ -n "$unresolved" ]; then
                printf '::error::Merge conflicts require manual resolution:\n%s\n' "$unresolved"
                git merge --abort
                exit 1
              fi
            fi

            git checkout HEAD -- README.md 2>/dev/null || true
            git checkout HEAD -- 'README-*.md' 2>/dev/null || true
            git checkout HEAD -- 'docs/images/readme-flow-*.svg' 2>/dev/null || true
            git add README.md README-*.md docs/images/readme-flow-*.svg 2>/dev/null || true
            git commit -m "chore: sync dev to master"
          fi

          MASTER_SHA="$(git rev-parse HEAD)"
          if [ "$OPERATION" = "new" ]; then
            git tag -a "$VERSION" "$MASTER_SHA" -m "Release $VERSION"
            git push --atomic origin "HEAD:refs/heads/master" "refs/tags/$VERSION"
          else
            git push origin "HEAD:refs/heads/master"
          fi

          echo "Synced dev $DEV_SHA to master $MASTER_SHA."
