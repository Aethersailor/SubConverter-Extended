name: CodeQL
'on':
  push:
    branches:
    - dev
  pull_request:
    branches:
    - dev
  schedule:
  - cron: 20 4 * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  schedule-dev:
    name: Schedule dev analysis
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Analyze dev on the daily schedule
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      run: gh workflow run codeql.yml --repo "$REPOSITORY" --ref dev
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: none
        - language: go
          build-mode: manual
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Prepare generated Dashboard header
      if: matrix.language == 'c-cpp'
      shell: bash
      run: |
        cmake \
          -DINPUT_FILE="$GITHUB_WORKSPACE/resources/dashboard/index.html" \
          -DOUTPUT_FILE="$GITHUB_WORKSPACE/src/generated/dashboard_page.html.inc" \
          -P cmake/embed_dashboard.cmake
    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: bridge/go.mod
        cache: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality
    - name: Build all Go platform sources and generators for analysis
      if: matrix.language == 'go'
      working-directory: bridge
      run: |
        go build -a -mod=readonly ./...
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -a -mod=readonly ./cmd/portable-updater
        go test -a -c -o "$RUNNER_TEMP/portable-updater-tests" ./cmd/portable-updater
        for generator in "$GITHUB_WORKSPACE"/scripts/generate_*.go; do
          go build -a -o "$RUNNER_TEMP/$(basename "$generator" .go)" "$generator"
        done
    - name: Upload CodeQL results
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        category: /language:${{ matrix.language }}
