name: 归档不活跃 Issue / Archive Inactive Issues

on:
  schedule:
    # 北京时间 03:17，避开整点高峰。 / 03:17 Asia/Shanghai, outside the hourly peak.
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 仅预览，不发表评论或关闭 Issue / Preview without commenting or closing issues
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: manage-inactive-issues
  cancel-in-progress: false

jobs:
  manage:
    name: 检查不活跃 Issue / Check inactive issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INACTIVE_ISSUE_WAIT_DAYS: "30"
      INACTIVE_ISSUE_GRACE_DAYS: "7"
      INACTIVE_ISSUE_DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: 检出仓库自动化脚本 / Check out repository automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: 提醒并归档不活跃 Issue / Remind and archive inactive issues
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const manageInactiveIssues = require('./.github/scripts/manage-inactive-issues.cjs');
            await manageInactiveIssues({ github, context, core });
