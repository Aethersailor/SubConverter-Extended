name: Build and Push Docker image

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'README.md'
      - 'README-*.md'
      - 'docker-compose.yml'
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'formal-release-pipeline' || format('build-core-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  source-head:
    name: "🧭 Verify Current Source Head"
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.verify.outputs.current }}
    steps:
      - name: Skip stale branch events
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const isBranch = context.ref.startsWith('refs/heads/');
            const checksBranchHead =
              isBranch &&
              (context.eventName === 'push' || context.eventName === 'workflow_dispatch');

            if (!checksBranchHead) {
              core.setOutput('current', 'true');
              return;
            }

            const branch = context.ref.slice('refs/heads/'.length);
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
            });
            const currentSha = data.commit.sha;
            const isCurrent = currentSha === context.sha;

            core.setOutput('current', String(isCurrent));
            if (isCurrent) {
              core.info(`${context.sha} is still the current head of ${branch}.`);
            } else if (context.eventName === 'workflow_dispatch') {
              core.setFailed(
                `Refusing stale workflow_dispatch event for ${context.sha}; ` +
                `${branch} now points to ${currentSha}.`
              );
            } else {
              core.notice(
                `Skipping stale ${context.eventName} event for ${context.sha}; ` +
                `${branch} now points to ${currentSha}.`
              );
            }

  prepare:
    name: "🔧 Prepare Metadata"
    runs-on: ubuntu-latest
    needs: source-head
    if: needs.source-head.outputs.current == 'true' && github.actor != 'dependabot[bot]' && (github.ref != 'refs/heads/dev' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')))
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      sha_short: ${{ steps.metadata.outputs.sha_short }}
      version: ${{ steps.metadata.outputs.version }}
      mode: ${{ steps.metadata.outputs.mode }}
      is_release: ${{ steps.metadata.outputs.is_release }}
      tags: ${{ steps.meta.outputs.tags }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      linux_matrix: ${{ steps.linux_matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          fetch-depth: 0

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/build_metadata.py \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify formal release preconditions
        if: steps.metadata.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          REVISION: ${{ steps.metadata.outputs.sha }}
        run: |
          set -euo pipefail

          if [ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]; then
            echo "::error::Formal releases require an annotated vX.Y.Z tag."
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF")"
          python3 scripts/ci/release_guard.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA" \
            --checkout-sha "$(git rev-parse HEAD)" \
            --tag-sha "$TAG_COMMIT"

          release_status="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")"
          case "$release_status" in
            404) ;;
            200)
              echo "Release $VERSION already exists and will be verified before reuse."
              ;;
            *)
              cat /tmp/release.json >&2
              echo "::error::Could not prove that Release $VERSION is absent (HTTP $release_status)."
              exit 1
              ;;
          esac

          probe_registry_tag() {
            local registry="$1"
            local repository="$2"
            local token_url="$3"
            local token
            local status
            token="$(curl --fail-with-body --silent --show-error "$token_url" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            status="$(curl -sS -o /tmp/registry-manifest -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://$registry/v2/$repository/manifests/$VERSION")"
            case "$status" in
              404) ;;
              200)
                echo "$registry/$repository:$VERSION already exists and will be verified before reuse."
                ;;
              *)
                cat /tmp/registry-manifest >&2
                echo "::error::Could not prove $registry/$repository:$VERSION is absent (HTTP $status)."
                exit 1
                ;;
            esac
          }

          probe_registry_tag \
            registry-1.docker.io \
            aethersailor/subconverter-extended \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:aethersailor/subconverter-extended:pull"
          probe_registry_tag \
            ghcr.io \
            aethersailor/subconverter-extended \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:aethersailor/subconverter-extended:pull"

      - name: Verify COCR runtime assets are absent
        shell: bash
        run: |
          set -euo pipefail
          if [ -e base/Custom_OpenClash_Rules ] || \
             git ls-files -- base/Custom_OpenClash_Rules | grep -q .; then
            echo "::error::Custom_OpenClash_Rules runtime assets must not exist in this project."
            exit 1
          fi

      - name: Refresh dependency snapshot on dev
        if: steps.metadata.outputs.mode == 'dev'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/dependency_snapshot.py refresh

      - name: Validate dependency snapshot
        shell: bash
        run: python3 scripts/ci/dependency_snapshot.py check

      - name: Export dependency metadata
        id: dependencies
        shell: bash
        run: |
          python3 scripts/ci/dependency_snapshot.py emit \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Summarize dependency snapshot
        shell: bash
        run: |
          {
            echo "### Dependency snapshot"
            echo
            echo "Mode: \`${{ steps.metadata.outputs.mode }}\`"
            echo "Snapshot SHA-256: \`${{ steps.dependencies.outputs.dependency_snapshot_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-snapshot
          path: scripts/ci/dependencies.lock.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Build Linux matrix
        id: linux_matrix
        shell: bash
        run: |
          python3 scripts/ci/build_plan.py matrix \
            --mode "${{ steps.metadata.outputs.mode }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          MODE: ${{ steps.metadata.outputs.mode }}
        run: |
          python3 scripts/ci/build_plan.py tags \
            --mode "$MODE" \
            --version "$VERSION" \
            --github-output "$GITHUB_OUTPUT"

  validate-source:
    name: "✅ Validate Source Once"
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.mode == 'dev' || needs.prepare.outputs.mode == 'pr'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Run maintained Python regressions
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run Go bridge regressions
        shell: bash
        working-directory: bridge
        run: go test -mod=readonly ./...

      - name: Validate workflow and delivery scripts
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          bash -n scripts/ci/*.sh
          bash tests/ci_delivery_scripts_test.sh

  build-linux:
    name: "🐳 Docker Build (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.linux_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          fetch-depth: 0

      - name: Download dependency snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-snapshot
          path: dependency-snapshot

      - name: Activate dependency snapshot
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          cp dependency-snapshot/dependencies.lock.json scripts/ci/dependencies.lock.json
          python3 scripts/ci/dependency_snapshot.py check
          python3 scripts/ci/dependency_snapshot.py emit \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Set up Docker Buildx
        shell: bash
        run: |
          docker buildx create --name sce-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && needs.prepare.outputs.mode != 'master'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && needs.prepare.outputs.mode != 'master'
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Prepare Docker build args
        id: docker_args
        shell: bash
        env:
          THREADS: ${{ matrix.threads }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          REFRESH_GO_DEPS: ${{ needs.prepare.outputs.mode == 'dev' && matrix.extract_generated == 'true' }}
          REFRESH_HEADERS: ${{ needs.prepare.outputs.mode == 'dev' && matrix.extract_generated == 'true' }}
          BUILD_TESTS: ${{ matrix.arch == 'amd64' && (needs.prepare.outputs.mode == 'dev' || needs.prepare.outputs.mode == 'pr') }}
        run: |
          {
            echo 'args<<EOF'
            bash scripts/ci/docker-build-args.sh
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build candidate image once
        id: build_image
        shell: bash
        env:
          BUILD_ARGS: ${{ steps.docker_args.outputs.args }}
        run: |
          bash scripts/ci/build-candidate-image.sh \
            "${{ matrix.arch }}" \
            "${{ matrix.dockerfile }}" \
            "${{ matrix.image_platform }}" \
            "${{ matrix.cache_scope }}" \
            "${{ github.event_name }}" \
            "${{ needs.prepare.outputs.mode }}" \
            "${{ needs.prepare.outputs.version }}"

      - name: Export CI artifacts from the existing cache
        shell: bash
        env:
          BUILD_ARGS: ${{ steps.docker_args.outputs.args }}
        run: |
          bash scripts/ci/export-ci-image.sh \
            "${{ matrix.dockerfile }}" \
            "${{ matrix.builder_tag }}" \
            "${{ matrix.builder_platform }}"

      - name: Extract builder output
        shell: bash
        env:
          EXTRACT_GENERATED: ${{ matrix.extract_generated }}
        run: bash scripts/ci/extract-builder-output.sh "${{ matrix.builder_tag }}" "${{ matrix.extract_mode }}"

      - name: Check bridge size budget (${{ matrix.arch }})
        shell: bash
        run: python3 scripts/ci/check_file_size.py --budget "${{ matrix.bridge_budget }}" "build/bridge-output/libmihomo.*"

      - name: Package Release Artifacts (Linux ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: bash scripts/ci/build-linux-release.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.arch }}" "${{ matrix.openwrt_arches }}"

      - name: Check release size budgets (Linux ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        shell: bash
        run: |
          python3 scripts/ci/check_file_size.py --budget release-linux \
            "SubConverter-Extended-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz"
          python3 scripts/ci/check_file_size.py --budget release-openwrt \
            "SubConverter-Extended-${{ needs.prepare.outputs.version }}-openwrt-*.apk"

      - name: Set up QEMU for smoke test
        if: matrix.qemu_platforms != ''
        shell: bash
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install "${{ matrix.qemu_platforms }}"

      - name: Smoke test artifact (Linux ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        timeout-minutes: 3
        uses: ./.github/actions/smoke-linux-artifact
        with:
          artifact: SubConverter-Extended-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          expected-version: ${{ needs.prepare.outputs.version }}
          expected-revision: ${{ needs.prepare.outputs.sha }}
          expected-build-date: ${{ needs.prepare.outputs.build_date }}

      - name: Smoke test APKs (OpenWrt ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        timeout-minutes: 3
        uses: ./.github/actions/smoke-openwrt-apk
        with:
          artifacts: SubConverter-Extended-${{ needs.prepare.outputs.version }}-openwrt-*.apk
          expected-version: ${{ needs.prepare.outputs.version }}
          expected-revision: ${{ needs.prepare.outputs.sha }}
          expected-build-date: ${{ needs.prepare.outputs.build_date }}

      - name: Upload Artifact (Linux ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-${{ matrix.arch }}
          path: SubConverter-Extended-*.tar.gz
          overwrite: true

      - name: Upload Artifact (OpenWrt ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openwrt-${{ matrix.arch }}
          path: SubConverter-Extended-*-openwrt-*.apk
          overwrite: true

      - name: Clean release packaging files
        if: needs.prepare.outputs.is_release == 'true'
        shell: bash
        run: rm -rf SubConverter-Extended SubConverter-Extended-*.tar.gz SubConverter-Extended-*.apk subconverter runtime-libs runtime-root libmihomo.so build/openwrt-apk

      - name: Check for file changes
        id: check_changes
        if: matrix.extract_generated == 'true'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- scripts/ci/dependencies.lock.json bridge/go.mod bridge/go.sum bridge/libmihomo.h bridge/mihomo_capabilities.json bridge/proxy_validation_generated.go src/parser/mihomo_schemes.h src/parser/param_compat.h include/httplib.h include/nlohmann/json.hpp include/inja.hpp include/jpcre2.hpp include/quickjspp.hpp include/libcron include/date include/toml.hpp include/toml11)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify frozen generated inputs outside dev
        if: steps.check_changes.outputs.changed == 'true' && needs.prepare.outputs.mode != 'dev'
        shell: bash
        run: |
          git status --short -- scripts/ci/dependencies.lock.json bridge/go.mod bridge/go.sum bridge/libmihomo.h bridge/mihomo_capabilities.json bridge/proxy_validation_generated.go src/parser/mihomo_schemes.h src/parser/param_compat.h include/httplib.h include/nlohmann/json.hpp include/inja.hpp include/jpcre2.hpp include/quickjspp.hpp include/libcron include/date include/toml.hpp include/toml11
          echo "::error::Frozen dependency/generated inputs are stale. Refresh and commit them on dev before building master or a release."
          exit 1

      - name: Save image digest
        if: github.event_name != 'pull_request' && needs.prepare.outputs.mode != 'master'
        shell: bash
        run: |
          mkdir -p docker-digests
          printf '%s\n' "${{ steps.build_image.outputs.digest }}" > "docker-digests/${{ matrix.arch }}.txt"

      - name: Upload image digest
        if: github.event_name != 'pull_request' && needs.prepare.outputs.mode != 'master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: docker-digests/${{ matrix.arch }}.txt
          retention-days: 30
          overwrite: true

      - name: Smoke test image (${{ matrix.arch }})
        if: github.event_name != 'pull_request' && needs.prepare.outputs.mode != 'master'
        timeout-minutes: 3
        uses: ./.github/actions/smoke-docker-image
        with:
          image: ghcr.io/aethersailor/subconverter-extended@${{ steps.build_image.outputs.digest }}
          platform: ${{ matrix.image_platform }}
          expected-version: ${{ needs.prepare.outputs.version }}
          expected-revision: ${{ needs.prepare.outputs.sha }}
          expected-build-date: ${{ needs.prepare.outputs.build_date }}

      - name: Commit and push generated development files
        if: steps.check_changes.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH_NAME="dev"

          git fetch --no-tags origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          remote_revision="$(git rev-parse "origin/$BRANCH_NAME")"
          if [ "$remote_revision" != "$SOURCE_REVISION" ]; then
            echo "::warning::dev advanced from $SOURCE_REVISION to $remote_revision; skipping stale generated-file writeback."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/dependencies.lock.json bridge/go.mod bridge/go.sum bridge/libmihomo.h bridge/mihomo_capabilities.json bridge/proxy_validation_generated.go src/parser/mihomo_schemes.h src/parser/param_compat.h include/httplib.h include/nlohmann/json.hpp include/inja.hpp include/jpcre2.hpp include/quickjspp.hpp include/libcron include/date include/toml.hpp include/toml11
          git commit -m "chore: update generated development inputs after build [skip ci]"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"

  build-windows-amd64:
    name: "🪟 Windows Build (amd64)"
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.is_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Download dependency snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-snapshot
          path: dependency-snapshot

      - name: Activate dependency snapshot
        shell: pwsh
        run: |
          Copy-Item dependency-snapshot/dependencies.lock.json scripts/ci/dependencies.lock.json -Force
          python scripts/ci/dependency_snapshot.py check
          python scripts/ci/dependency_snapshot.py emit --github-env $env:GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-yaml-cpp
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-rapidjson

      - name: Build Windows amd64
        shell: msys2 {0}
        run: |
          THREADS=4 bash scripts/build-windows-amd64.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.sha }}" \
            "${{ needs.prepare.outputs.build_date }}"

      - name: Package Release Artifact (Windows amd64)
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1 -Version "${{ needs.prepare.outputs.version }}" -Revision "${{ needs.prepare.outputs.sha }}" -BuildDate "${{ needs.prepare.outputs.build_date }}"

      - name: Check release size budget (Windows amd64)
        shell: pwsh
        run: python scripts/ci/check_file_size.py --budget release-windows-amd64 "SubConverter-Extended-${{ needs.prepare.outputs.version }}-windows-amd64.zip"

      - name: Smoke test artifact (Windows amd64)
        timeout-minutes: 3
        uses: ./.github/actions/smoke-windows-artifact
        with:
          artifact: SubConverter-Extended-${{ needs.prepare.outputs.version }}-windows-amd64.zip
          expected-version: ${{ needs.prepare.outputs.version }}
          expected-revision: ${{ needs.prepare.outputs.sha }}
          expected-build-date: ${{ needs.prepare.outputs.build_date }}

      - name: Upload Artifact (Windows amd64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-amd64
          path: SubConverter-Extended-*.zip
          overwrite: true

  merge-manifest:
    name: "🔗 Publish Version Docker Images"
    runs-on: ubuntu-latest
    needs: [prepare, validate-source, build-linux]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.prepare.outputs.mode != 'master' &&
      needs.prepare.result == 'success' &&
      needs.build-linux.result == 'success' &&
      (needs.validate-source.result == 'success' || needs.prepare.outputs.mode == 'release')
    outputs:
      dockerhub_digest: ${{ steps.published.outputs.dockerhub_digest }}
      ghcr_digest: ${{ steps.published.outputs.ghcr_digest }}
    steps:
      - name: Prevent stale dev image promotion
        if: needs.prepare.outputs.mode == 'dev'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const sourceSha = process.env.SOURCE_SHA;
            const { data: branchData } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
            });
            const currentSha = branchData.commit.sha;

            if (currentSha === sourceSha) {
              core.info(`${sourceSha} is still the current head of ${branch}.`);
              return;
            }

            const { data: currentCommit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: currentSha,
            });
            const generatedCommitTitle =
              'chore: update generated development inputs after build [skip ci]';
            const isExpectedGeneratedChild =
              currentCommit.parents.length === 1 &&
              currentCommit.parents[0].sha === sourceSha &&
              currentCommit.commit.message.split('\n', 1)[0] === generatedCommitTitle &&
              currentCommit.committer?.login === 'github-actions[bot]';

            if (isExpectedGeneratedChild) {
              core.info(
                `${currentSha} is the expected generated child of ${sourceSha}; ` +
                'promotion remains valid.'
              );
              return;
            }

            core.setFailed(
              `Refusing to promote stale image for ${sourceSha}; ` +
              `${branch} now points to ${currentSha}.`
            );

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Assemble tested release candidate manifests
        id: release_candidate
        if: needs.prepare.outputs.mode == 'release'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.sha }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: |
          set -euo pipefail
          ARCHES=(amd64 arm64 armv7)
          PLATFORMS=(linux/amd64 linux/arm64 linux/arm/v7)
          for arch in "${ARCHES[@]}"; do
            test -s "digests/${arch}.txt"
            grep -Eq '^sha256:[0-9a-f]{64}$' "digests/${arch}.txt"
          done
          inspect_digest() {
            docker buildx imagetools inspect "$1" |
              awk '$1 == "Digest:" && digest == "" {digest = $2} END {if (digest == "") exit 1; print digest}'
          }
          dockerhub_candidate="aethersailor/subconverter-extended:ci-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-manifest"
          ghcr_candidate="ghcr.io/aethersailor/subconverter-extended:ci-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-manifest"
          for candidate in "$dockerhub_candidate" "$ghcr_candidate"; do
            sources=()
            for arch in "${ARCHES[@]}"; do
              source="${candidate%%:ci-*}@$(cat "digests/${arch}.txt")"
              sources+=("$source")
            done
            docker buildx imagetools create -t "$candidate" "${sources[@]}"
            for attempt in $(seq 1 6); do
              if docker buildx imagetools inspect "$candidate" > candidate-manifest.txt; then
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "::error::Could not inspect tested candidate $candidate."
                exit 1
              fi
              sleep 5
            done
            for platform in "${PLATFORMS[@]}"; do
              if ! grep -Eq "Platform:[[:space:]]+${platform}$" candidate-manifest.txt; then
                echo "::error::Tested candidate $candidate is missing $platform."
                exit 1
              fi
              docker pull --platform "$platform" "$candidate"
              test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$candidate")" = "$VERSION"
              test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$candidate")" = "$REVISION"
              test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.created" }}' "$candidate")" = "$BUILD_DATE"
            done
          done
          dockerhub_digest="$(inspect_digest "$dockerhub_candidate")"
          ghcr_digest="$(inspect_digest "$ghcr_candidate")"
          if [[ ! "$dockerhub_digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             [ "$dockerhub_digest" != "$ghcr_digest" ]; then
            echo "::error::Tested release candidate manifests do not share one digest."
            exit 1
          fi
          echo "digest=$dockerhub_digest" >> "$GITHUB_OUTPUT"

      - name: Resolve formal version tag state
        id: version_tag_state
        if: needs.prepare.outputs.mode == 'release'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CANDIDATE_DIGEST: ${{ steps.release_candidate.outputs.digest }}
        run: |
          set -euo pipefail
          remote_tag_commit="$(git ls-remote \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$VERSION^{}" | awk '{print $1}')"
          if [ "$remote_tag_commit" != "${{ needs.prepare.outputs.sha }}" ]; then
            echo "::error::Remote annotated tag $VERSION no longer peels to the approved source SHA."
            exit 1
          fi
          probe_state() {
            local registry="$1"
            local repository="$2"
            local token_url="$3"
            local token
            local status
            token="$(curl --fail-with-body --silent --show-error "$token_url" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            status="$(curl -sS -o /tmp/manifest -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://$registry/v2/$repository/manifests/$VERSION")"
            if [ "$status" = "404" ]; then
              echo absent
              return 0
            fi
            if [ "$status" = "200" ]; then
              echo present
              return 0
            fi
            echo "::error::Could not resolve $registry/$repository:$VERSION (HTTP $status)." >&2
            exit 1
          }
          dockerhub_state="$(probe_state \
            registry-1.docker.io \
            aethersailor/subconverter-extended \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:aethersailor/subconverter-extended:pull")"
          ghcr_state="$(probe_state \
            ghcr.io \
            aethersailor/subconverter-extended \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:aethersailor/subconverter-extended:pull")"
          inspect_digest() {
            docker buildx imagetools inspect "$1" |
              awk '$1 == "Digest:" && digest == "" {digest = $2} END {if (digest == "") exit 1; print digest}'
          }
          if [ "$dockerhub_state" = present ]; then
            dockerhub_digest="$(inspect_digest "aethersailor/subconverter-extended:$VERSION")"
            if [ "$dockerhub_digest" != "$CANDIDATE_DIGEST" ]; then
              echo "::error::Existing Docker Hub version tag differs from the tested candidate."
              exit 1
            fi
          fi
          if [ "$ghcr_state" = present ]; then
            ghcr_digest="$(inspect_digest "ghcr.io/aethersailor/subconverter-extended:$VERSION")"
            if [ "$ghcr_digest" != "$CANDIDATE_DIGEST" ]; then
              echo "::error::Existing GHCR version tag differs from the tested candidate."
              exit 1
            fi
          fi
          echo "dockerhub_present=$([ "$dockerhub_state" = present ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ghcr_present=$([ "$ghcr_state" = present ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Any existing formal version tag exactly matches the tested candidate digest."

      - name: Promote tested candidates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          RELEASE_CANDIDATE_DIGEST="${{ steps.release_candidate.outputs.digest }}"
          inspect_digest() {
            docker buildx imagetools inspect "$1" |
              awk '$1 == "Digest:" && digest == "" {digest = $2} END {if (digest == "") exit 1; print digest}'
          }

          if [ "${{ needs.prepare.outputs.mode }}" = "dev" ]; then
            ARCHES=(amd64)
          else
            ARCHES=(amd64 arm64 armv7)
          fi
          for arch in "${ARCHES[@]}"; do
            test -s "digests/${arch}.txt"
            grep -Eq '^sha256:[0-9a-f]{64}$' "digests/${arch}.txt"
          done

          TAGS="${{ needs.prepare.outputs.tags }}"
          IMAGE_NAMES=(
            "aethersailor/subconverter-extended"
            "ghcr.io/aethersailor/subconverter-extended"
          )

          for IMAGE_NAME in "${IMAGE_NAMES[@]}"; do
            SOURCES=()
            if [ "${{ needs.prepare.outputs.mode }}" = "release" ]; then
              SOURCES+=("${IMAGE_NAME}:ci-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-manifest@${RELEASE_CANDIDATE_DIGEST}")
            else
              for arch in "${ARCHES[@]}"; do
                SOURCES+=("${IMAGE_NAME}@$(cat "digests/${arch}.txt")")
              done
            fi
            for TAG in $TAGS; do
              if [[ "$TAG" == "$IMAGE_NAME:"* ]]; then
                if [ "${{ needs.prepare.outputs.mode }}" = "release" ]; then
                  if [[ "$IMAGE_NAME" == ghcr.io/* ]] &&
                     [ "${{ steps.version_tag_state.outputs.ghcr_present }}" = true ]; then
                    echo "Keeping verified existing $TAG"
                    continue
                  fi
                  if [[ "$IMAGE_NAME" != ghcr.io/* ]] &&
                     [ "${{ steps.version_tag_state.outputs.dockerhub_present }}" = true ]; then
                    echo "Keeping verified existing $TAG"
                    continue
                  fi
                fi
                echo "Promoting ${SOURCES[*]} to $TAG"
                docker buildx imagetools create -t "$TAG" "${SOURCES[@]}"
                if [ "${{ needs.prepare.outputs.mode }}" = "release" ] && \
                   [ "$(inspect_digest "$TAG")" != "$RELEASE_CANDIDATE_DIGEST" ]; then
                  echo "::error::Formal version tag does not match the tested candidate digest."
                  exit 1
                fi
              fi
            done
          done

      - name: Verify manifest platforms
        id: published
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.prepare.outputs.mode }}" = "dev" ]; then
            PLATFORMS=("linux/amd64")
          else
            PLATFORMS=("linux/amd64" "linux/arm64" "linux/arm/v7")
          fi
          TAGS="${{ needs.prepare.outputs.tags }}"
          DOCKERHUB_DIGEST=""
          GHCR_DIGEST=""
          for TAG in $TAGS; do
            echo "Inspecting $TAG"
            for attempt in $(seq 1 6); do
              if docker buildx imagetools inspect "$TAG" > manifest.txt; then
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "Failed to inspect $TAG"
                exit 1
              fi
              sleep 5
            done

            cat manifest.txt
            digest="$(awk '$1 == "Digest:" {print $2; exit}' manifest.txt)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not resolve the manifest digest for $TAG."
              exit 1
            fi
            if [[ "$TAG" == ghcr.io/* ]]; then
              GHCR_DIGEST="$digest"
              echo "ghcr_digest=$digest" >> "$GITHUB_OUTPUT"
            else
              DOCKERHUB_DIGEST="$digest"
              echo "dockerhub_digest=$digest" >> "$GITHUB_OUTPUT"
            fi

            for PLATFORM in "${PLATFORMS[@]}"; do
              if ! grep -Eq "Platform:[[:space:]]+${PLATFORM}$" manifest.txt; then
                echo "Missing platform ${PLATFORM} in ${TAG}"
                exit 1
              fi
              docker pull --platform "$PLATFORM" "$TAG"
              actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$TAG")"
              actual_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$TAG")"
              test "$actual_revision" = "${{ needs.prepare.outputs.sha }}"
              test "$actual_version" = "${{ needs.prepare.outputs.version }}"
            done
          done
          test -n "$DOCKERHUB_DIGEST"
          test -n "$GHCR_DIGEST"
          if [ "$DOCKERHUB_DIGEST" != "$GHCR_DIGEST" ]; then
            echo "::error::Docker Hub and GHCR manifest digests differ."
            exit 1
          fi

  create-release:
    name: "🚀 Release Artifacts"
    runs-on: ubuntu-latest
    needs: [prepare, build-linux, build-windows-amd64, merge-manifest]
    outputs:
      release_notes_sha256: ${{ steps.release_gate.outputs.release_notes_sha256 }}
      release_notes_source: ${{ steps.release_notes.outputs.release_notes_source }}
      previous_tag: ${{ steps.release_context.outputs.previous_tag }}
    if: >-
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.prepare.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows-amd64.result == 'success' &&
      needs.merge-manifest.result == 'success' &&
      needs.prepare.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Prepare Release Notes Context
        id: release_context
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          CURRENT_TAG="$RELEASE_VERSION"
          CURRENT_COMMIT="$(git rev-list -n 1 "$CURRENT_TAG")"
          test "$CURRENT_COMMIT" = "${{ needs.prepare.outputs.sha }}"
          REMOTE_COMMIT="$(git ls-remote origin "refs/tags/$CURRENT_TAG^{}" | awk '{print $1}')"
          test "$REMOTE_COMMIT" = "$CURRENT_COMMIT"
          PREVIOUS_TAG="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')"
          if [ "$PREVIOUS_TAG" = "$CURRENT_TAG" ]; then
            gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > published-releases.json
            PREVIOUS_TAG="$(python3 - "$CURRENT_TAG" <<'PY'
          import json
          import sys

          current = sys.argv[1]
          releases = json.load(open("published-releases.json", encoding="utf-8"))
          previous = next(
              (
                  release["tag_name"]
                  for release in releases
                  if not release["draft"]
                  and not release["prerelease"]
                  and release["tag_name"] != current
              ),
              "",
          )
          print(previous)
          PY
            )"
          fi
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "::error::Latest published GitHub Release returned an empty tag."
            exit 1
          fi
          if ! [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest published Release tag is not canonical SemVer: $PREVIOUS_TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PREVIOUS_TAG" "$CURRENT_COMMIT"; then
            echo "::error::Latest published Release $PREVIOUS_TAG is not an ancestor of $CURRENT_TAG."
            exit 1
          fi

          rm -f release-notes.ai.json release-notes.status.json
          python3 scripts/ci/release_notes.py context \
            --repository "$GITHUB_REPOSITORY" \
            --previous-tag "$PREVIOUS_TAG" \
            --current-tag "$CURRENT_TAG" \
            --current-commit "$CURRENT_COMMIT" \
            --output release-context.json
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Check Copilot Token
        id: copilot_token
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        id: setup_node
        if: steps.copilot_token.outputs.available == 'true'
        continue-on-error: true
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6

      - name: Install and Verify Copilot CLI
        id: copilot_cli
        continue-on-error: true
        timeout-minutes: 3
        if: >-
          steps.copilot_token.outputs.available == 'true' &&
          steps.setup_node.outcome == 'success'
        run: |
          set -euo pipefail

          echo "available=false" >> "$GITHUB_OUTPUT"
          if ! timeout --signal=TERM 120s npm install -g @github/copilot@1.0.70; then
            echo "::warning::Copilot CLI installation failed; the deterministic Chinese summary will be used."
            exit 0
          fi
          COPILOT_VERSION="$(timeout --signal=TERM 15s copilot --no-auto-update --version 2>/dev/null || true)"
          COPILOT_VERSION="${COPILOT_VERSION%%$'\n'*}"
          case "$COPILOT_VERSION" in
            'GitHub Copilot CLI 1.0.70'|'GitHub Copilot CLI 1.0.70.') ;;
            *)
              echo "::warning::The installed Copilot CLI identity is unexpected; the deterministic Chinese summary will be used."
              exit 0
              ;;
          esac
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Generate and Review Chinese Release Notes with Copilot
        if: >-
          steps.copilot_token.outputs.available == 'true' &&
          steps.copilot_cli.outputs.available == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -f release-notes.ai.json release-notes.status.json
          if ! python3 scripts/ci/release_notes.py generate \
            --context release-context.json \
            --output release-notes.ai.json \
            --status release-notes.status.json \
            --runner-temp "$RUNNER_TEMP"; then
            rm -f release-notes.ai.json
            echo "::warning::Copilot generation could not be validated; the deterministic Chinese summary will be used."
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: false

      - name: Generate checksums
        run: |
          set -euo pipefail

          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' \) -print | sort | while read -r file; do
            sha256sum "$file" | sed 's#  artifacts/[^/]*/#  #'
          done > SHA256SUMS

          cat SHA256SUMS
          duplicate_names="$(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' \) -printf '%f\n' | sort | uniq -d)"
          if [ -n "$duplicate_names" ]; then
            echo "::error::Duplicate release asset names: $duplicate_names"
            exit 1
          fi
          mkdir release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' \) \
            -exec cp '{}' release-assets/ \;
          cp SHA256SUMS release-assets/SHA256SUMS

      - name: Generate release manifest
        shell: bash
        run: |
          python3 scripts/ci/release_manifest.py build \
            --root release-assets \
            --output release-assets/RELEASE-MANIFEST.json \
            --version "${{ needs.prepare.outputs.version }}" \
            --revision "${{ needs.prepare.outputs.sha }}" \
            --build-date "${{ needs.prepare.outputs.build_date }}" \
            --dockerhub-digest "${{ needs.merge-manifest.outputs.dockerhub_digest }}" \
            --ghcr-digest "${{ needs.merge-manifest.outputs.ghcr_digest }}"
          python3 scripts/ci/release_manifest.py verify \
            --root release-assets \
            --manifest release-assets/RELEASE-MANIFEST.json

      - name: Assemble and Validate Chinese Release Notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release_notes.py assemble \
            --context release-context.json \
            --candidate release-notes.ai.json \
            --status release-notes.status.json \
            --manifest release-assets/RELEASE-MANIFEST.json \
            --output release-notes.md \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Create or verify the GitHub Release
        id: release_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          CONTEXT_SHA256="$(python3 -c 'import json; print(json.load(open("release-context.json", encoding="utf-8"))["context_sha256"])')"
          [[ "$CONTEXT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          created=false
          cleanup_failed_draft() {
            if [ "$created" = true ]; then
              gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          }
          trap cleanup_failed_draft ERR

          if gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
            > existing-release.json 2>/dev/null; then
            is_draft="$(python3 -c 'import json; print(str(json.load(open("existing-release.json", encoding="utf-8"))["draft"]).lower())')"
            python3 - "$VERSION" <<'PY'
          import json
          import sys

          version = sys.argv[1]
          release = json.load(open("existing-release.json", encoding="utf-8"))
          if release.get("author", {}).get("login") != "github-actions[bot]":
              raise SystemExit("existing Release is not owned by github-actions[bot]")
          if release.get("tag_name") != version or release.get("name") != version:
              raise SystemExit("existing Release identity does not match the formal version")
          PY
            if [ "$is_draft" = false ]; then
              python3 scripts/ci/release_notes.py verify-body \
                --release-json existing-release.json \
                --validate-only \
                --expected-version "$VERSION" \
                --expected-revision "$REVISION" \
                --expected-context-sha256 "$CONTEXT_SHA256" \
                --github-output "$GITHUB_OUTPUT"
              mkdir existing-release-assets
              gh release download "$VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --dir existing-release-assets
              python3 scripts/ci/release_manifest.py verify \
                --root existing-release-assets \
                --manifest existing-release-assets/RELEASE-MANIFEST.json
              echo "Existing published Release $VERSION passed body and asset verification."
              trap - ERR
              exit 0
            fi
            if [ "$is_draft" != true ]; then
              echo "::error::Existing Release $VERSION has an invalid draft state."
              exit 1
            fi
            python3 scripts/ci/release_notes.py verify-body \
              --release-json existing-release.json \
              --validate-only \
              --expected-version "$VERSION" \
              --expected-revision "$REVISION" \
              --expected-context-sha256 "$CONTEXT_SHA256"
            echo "Replacing the stale verified-tag draft for idempotent continuation."
            gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes
          fi

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$VERSION" \
            --notes-file release-notes.md
          created=true
          gh release upload "$VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY"
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
            > created-release.json
          python3 scripts/ci/release_notes.py verify-body \
            --release-json created-release.json \
            --expected release-notes.md \
            --expected-version "$VERSION" \
            --expected-revision "$REVISION" \
            --expected-context-sha256 "$CONTEXT_SHA256" \
            --github-output "$GITHUB_OUTPUT"
          trap - ERR

  finalize-release:
    name: "🔒 Verify, Advance latest, and Publish Release"
    runs-on: ubuntu-latest
    concurrency:
      group: formal-release-finalization
      cancel-in-progress: false
    needs: [prepare, merge-manifest, create-release]
    if: >-
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.prepare.result == 'success' &&
      needs.merge-manifest.result == 'success' &&
      needs.create-release.result == 'success' &&
      needs.prepare.outputs.is_release == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Re-verify Release assets and tag identity
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.sha }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          RELEASE_NOTES_SHA256: ${{ needs.create-release.outputs.release_notes_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(git rev-list -n 1 "$VERSION")" = "$REVISION"
          test "$(git ls-remote origin "refs/tags/$VERSION^{}" | awk '{print $1}')" = "$REVISION"
          is_draft="$(gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft')"
          if [ "$is_draft" != "true" ] && [ "$is_draft" != "false" ]; then
            echo "::error::Release $VERSION has an invalid draft state."
            exit 1
          fi
          echo "was_draft=$is_draft" >> "$GITHUB_OUTPUT"

          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
            > verified-release.json
          python3 scripts/ci/release_notes.py verify-body \
            --release-json verified-release.json \
            --expected-sha256 "$RELEASE_NOTES_SHA256"

          mkdir verified-assets
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir verified-assets
          python3 scripts/ci/release_manifest.py verify \
            --root verified-assets \
            --manifest verified-assets/RELEASE-MANIFEST.json

          python3 - \
            "$VERSION" \
            "$REVISION" \
            "$BUILD_DATE" \
            "${{ needs.merge-manifest.outputs.dockerhub_digest }}" \
            "${{ needs.merge-manifest.outputs.ghcr_digest }}" <<'PY'
          import json
          import sys

          version, revision, build_date, dockerhub_digest, ghcr_digest = sys.argv[1:]
          manifest = json.load(open("verified-assets/RELEASE-MANIFEST.json", encoding="utf-8"))
          if manifest["version"] != version or manifest["tag"] != version:
              raise SystemExit("release manifest version identity changed")
          if manifest["revision"] != revision:
              raise SystemExit("release manifest revision changed")
          if manifest["build_date"] != build_date:
              raise SystemExit("release manifest build date changed")
          if manifest["images"]["dockerhub"]["digest"] != dockerhub_digest:
              raise SystemExit("Docker Hub digest changed")
          if manifest["images"]["ghcr"]["digest"] != ghcr_digest:
              raise SystemExit("GHCR digest changed")
          PY

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Re-verify published version digests
        id: version_images
        shell: bash
        run: |
          set -euo pipefail
          inspect_digest() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" && digest == "" {digest = $2} END {if (digest == "") exit 1; print digest}'
          }
          test "$(inspect_digest "aethersailor/subconverter-extended:${{ needs.prepare.outputs.version }}")" = "${{ needs.merge-manifest.outputs.dockerhub_digest }}"
          test "$(inspect_digest "ghcr.io/aethersailor/subconverter-extended:${{ needs.prepare.outputs.version }}")" = "${{ needs.merge-manifest.outputs.ghcr_digest }}"
          dockerhub_latest="$(inspect_digest aethersailor/subconverter-extended:latest)"
          ghcr_latest="$(inspect_digest ghcr.io/aethersailor/subconverter-extended:latest)"
          [[ "$dockerhub_latest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ghcr_latest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "dockerhub_latest=$dockerhub_latest" >> "$GITHUB_OUTPUT"
          echo "ghcr_latest=$ghcr_latest" >> "$GITHUB_OUTPUT"

      - name: Refuse stale formal release finalization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BASE_TAG: ${{ needs.create-release.outputs.previous_tag }}
        run: |
          set -euo pipefail
          latest_tag="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')"
          python3 - "$VERSION" "$latest_tag" <<'PY'
          import re
          import sys

          pattern = re.compile(r"^v([0-9]+)\.([0-9]+)\.([0-9]+)$")
          current_match = pattern.fullmatch(sys.argv[1])
          latest_match = pattern.fullmatch(sys.argv[2])
          if current_match is None or latest_match is None:
              raise SystemExit("formal Release ordering requires canonical SemVer tags")
          current = tuple(map(int, current_match.groups()))
          latest = tuple(map(int, latest_match.groups()))
          if latest > current:
              raise SystemExit(
                  f"refusing to finalize stale {sys.argv[1]} after newer {sys.argv[2]}"
              )
          PY
          if [ "$latest_tag" != "$VERSION" ] && [ "$latest_tag" != "$RELEASE_BASE_TAG" ]; then
            echo "::error::Release Note base $RELEASE_BASE_TAG no longer matches latest published Release $latest_tag."
            exit 1
          fi
          if [ "$latest_tag" != "$VERSION" ]; then
            git fetch --tags --force origin
            if ! git merge-base --is-ancestor "$latest_tag" "$VERSION"; then
              echo "::error::Latest published Release $latest_tag is not an ancestor of $VERSION."
              exit 1
            fi
          fi

      - name: Advance latest only after full release verification
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          inspect_digest() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" && digest == "" {digest = $2} END {if (digest == "") exit 1; print digest}'
          }
          OLD_DOCKERHUB="${{ steps.version_images.outputs.dockerhub_latest }}"
          OLD_GHCR="${{ steps.version_images.outputs.ghcr_latest }}"
          test "$(inspect_digest aethersailor/subconverter-extended:latest)" = "$OLD_DOCKERHUB"
          test "$(inspect_digest ghcr.io/aethersailor/subconverter-extended:latest)" = "$OLD_GHCR"

          rollback_latest() {
            echo "::warning::Restoring the pre-release latest pointers after a promotion failure."
            local failed=false
            if ! docker buildx imagetools create \
              -t aethersailor/subconverter-extended:latest \
              "aethersailor/subconverter-extended@$OLD_DOCKERHUB"; then
              failed=true
            fi
            if ! docker buildx imagetools create \
              -t ghcr.io/aethersailor/subconverter-extended:latest \
              "ghcr.io/aethersailor/subconverter-extended@$OLD_GHCR"; then
              failed=true
            fi
            if [ "$(inspect_digest aethersailor/subconverter-extended:latest 2>/dev/null || true)" != "$OLD_DOCKERHUB" ] || \
               [ "$(inspect_digest ghcr.io/aethersailor/subconverter-extended:latest 2>/dev/null || true)" != "$OLD_GHCR" ]; then
              failed=true
            fi
            if [ "$failed" = true ]; then
              echo "::error::Could not fully restore the pre-release latest pointers."
              return 1
            fi
            echo "Both latest pointers were restored and verified."
          }

          fail_after_latest() {
            local message="$1"
            if ! rollback_latest; then
              echo "::error::Manual registry inspection may be required before retrying."
            fi
            echo "::error::$message"
            exit 1
          }

          if ! docker buildx imagetools create \
            -t aethersailor/subconverter-extended:latest \
            "aethersailor/subconverter-extended:$VERSION"; then
            fail_after_latest "Docker Hub latest promotion failed."
          fi
          if ! docker buildx imagetools create \
            -t ghcr.io/aethersailor/subconverter-extended:latest \
            "ghcr.io/aethersailor/subconverter-extended:$VERSION"; then
            fail_after_latest "GHCR latest promotion failed."
          fi

          if [ "$(inspect_digest aethersailor/subconverter-extended:latest)" != "${{ needs.merge-manifest.outputs.dockerhub_digest }}" ] || \
             [ "$(inspect_digest ghcr.io/aethersailor/subconverter-extended:latest)" != "${{ needs.merge-manifest.outputs.ghcr_digest }}" ]; then
            fail_after_latest "latest digest verification failed."
          fi

      - name: Publish GitHub Release after latest is verified
        if: steps.release_state.outputs.was_draft == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OLD_DOCKERHUB: ${{ steps.version_images.outputs.dockerhub_latest }}
          OLD_GHCR: ${{ steps.version_images.outputs.ghcr_latest }}
        run: |
          set -euo pipefail
          inspect_digest() {
            docker buildx imagetools inspect "$1" |
              awk '$1 == "Digest:" && digest == "" {digest = $2} END {if (digest == "") exit 1; print digest}'
          }
          rollback_latest() {
            local failed=false
            echo "::warning::Release publication failed; restoring both latest pointers."
            if ! docker buildx imagetools create \
              -t aethersailor/subconverter-extended:latest \
              "aethersailor/subconverter-extended@$OLD_DOCKERHUB"; then
              failed=true
            fi
            if ! docker buildx imagetools create \
              -t ghcr.io/aethersailor/subconverter-extended:latest \
              "ghcr.io/aethersailor/subconverter-extended@$OLD_GHCR"; then
              failed=true
            fi
            if [ "$(inspect_digest aethersailor/subconverter-extended:latest 2>/dev/null || true)" != "$OLD_DOCKERHUB" ] || \
               [ "$(inspect_digest ghcr.io/aethersailor/subconverter-extended:latest 2>/dev/null || true)" != "$OLD_GHCR" ]; then
              failed=true
            fi
            if [ "$failed" = true ]; then
              echo "::error::Could not fully restore latest after Release publication failed."
              return 1
            fi
            echo "Both latest pointers were restored and verified."
          }
          fail_publication() {
            local message="$1"
            if ! rollback_latest; then
              echo "::error::Manual registry inspection may be required before retrying."
            fi
            echo "::error::$message"
            exit 1
          }
          read_release_state() {
            local state
            local saw_draft=false
            for attempt in $(seq 1 6); do
              if state="$(gh release view "$VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft \
                --jq '.isDraft')"; then
                if [ "$state" = "false" ]; then
                  printf '%s\n' false
                  return 0
                fi
                if [ "$state" = "true" ]; then
                  saw_draft=true
                fi
              fi
              sleep 5
            done
            if [ "$saw_draft" = true ]; then
              printf '%s\n' true
              return 0
            fi
            return 1
          }

          if ! gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false; then
            echo "::warning::The publication response was inconclusive; checking the server state."
          fi
          if ! published_state="$(read_release_state)"; then
            echo "::error::Could not determine whether the GitHub Release was published; keeping verified latest pointers for a safe retry."
            exit 1
          fi
          if [ "$published_state" = "true" ]; then
            fail_publication "GitHub Release remained a draft after publication."
          fi

  verify-release-complete:
    name: "✅ Verify Formal Release Completion"
    runs-on: ubuntu-latest
    needs: [prepare, build-linux, build-windows-amd64, merge-manifest, create-release, finalize-release]
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Require every formal release stage
        shell: bash
        env:
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          WINDOWS_RESULT: ${{ needs.build-windows-amd64.result }}
          MANIFEST_RESULT: ${{ needs.merge-manifest.result }}
          RELEASE_RESULT: ${{ needs.create-release.result }}
          FINALIZE_RESULT: ${{ needs.finalize-release.result }}
        run: |
          set -euo pipefail
          test "$RELEASE_MODE" = "release"
          test "$IS_RELEASE" = "true"
          for stage in \
            "prepare=$PREPARE_RESULT" \
            "linux=$LINUX_RESULT" \
            "windows=$WINDOWS_RESULT" \
            "manifest=$MANIFEST_RESULT" \
            "release=$RELEASE_RESULT" \
            "finalize=$FINALIZE_RESULT"; do
            if [ "${stage#*=}" != "success" ]; then
              echo "::error::Formal release stage did not succeed: $stage"
              exit 1
            fi
          done
