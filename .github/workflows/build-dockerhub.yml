name: Build and Push Docker image

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'README.md'
      - 'README-*.md'
      - 'docker-compose.yml'
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  packages: write

concurrency:
  group: build-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-head:
    name: "🧭 Verify Current Source Head"
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.verify.outputs.current }}
    steps:
      - name: Skip stale branch events
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const isBranch = context.ref.startsWith('refs/heads/');
            const checksBranchHead =
              isBranch &&
              (context.eventName === 'push' || context.eventName === 'workflow_dispatch');

            if (!checksBranchHead) {
              core.setOutput('current', 'true');
              return;
            }

            const branch = context.ref.slice('refs/heads/'.length);
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
            });
            const currentSha = data.commit.sha;
            const isCurrent = currentSha === context.sha;

            core.setOutput('current', String(isCurrent));
            if (isCurrent) {
              core.info(`${context.sha} is still the current head of ${branch}.`);
            } else if (context.eventName === 'workflow_dispatch') {
              core.setFailed(
                `Refusing stale workflow_dispatch event for ${context.sha}; ` +
                `${branch} now points to ${currentSha}.`
              );
            } else {
              core.notice(
                `Skipping stale ${context.eventName} event for ${context.sha}; ` +
                `${branch} now points to ${currentSha}.`
              );
            }

  request-sanitizers:
    name: "🧪 Request Settings ASan/UBSan"
    runs-on: ubuntu-latest
    needs: source-head
    if: needs.source-head.outputs.current == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve pinned build inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/dependency_snapshot.py check
          python3 scripts/ci/dependency_snapshot.py emit \
            --github-env "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and run request sanitizer targets
        shell: bash
        run: |
          set -euo pipefail
          export THREADS="$(nproc)"
          export SHA="$GITHUB_SHA"
          export VERSION="sanitizer-${GITHUB_SHA::7}"
          export BUILD_DATE="$(git show -s --format=%cI HEAD)"
          export BUILD_TESTS=true
          mapfile -t build_args < <(bash scripts/ci/docker-build-args.sh)
          args=()
          for arg in "${build_args[@]}"; do
            [ -n "$arg" ] && args+=(--build-arg "$arg")
          done
          args+=(--build-arg ENABLE_SANITIZERS=true)
          echo "Sanitizer CMake option: -DENABLE_SANITIZERS=true"
          echo "Sanitizer build targets: production runtime and all BUILD_TESTS targets"
          echo "Sanitizer run targets: settings_view, settings_view_invariant_failure, compatibility_security_baseline"
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --target builder \
            --output type=cacheonly \
            --cache-from type=gha,scope=request-sanitizers \
            --cache-to type=gha,scope=request-sanitizers,mode=max \
            --progress plain \
            "${args[@]}" \
            .

  prepare:
    name: "🔧 Prepare Metadata"
    runs-on: ubuntu-latest
    needs:
      - source-head
      - request-sanitizers
    if: needs.source-head.outputs.current == 'true' && github.actor != 'dependabot[bot]' && (github.ref != 'refs/heads/dev' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')))
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      sha_short: ${{ steps.metadata.outputs.sha_short }}
      version: ${{ steps.metadata.outputs.version }}
      mode: ${{ steps.metadata.outputs.mode }}
      is_release: ${{ steps.metadata.outputs.is_release }}
      tags: ${{ steps.meta.outputs.tags }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      linux_matrix: ${{ steps.linux_matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          fetch-depth: 0

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/build_metadata.py \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify immutable formal release preconditions
        if: steps.metadata.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          REVISION: ${{ steps.metadata.outputs.sha }}
        run: |
          set -euo pipefail

          if [ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]; then
            echo "::error::Formal releases require an annotated vX.Y.Z tag."
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF")"
          python3 scripts/ci/release_guard.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA" \
            --checkout-sha "$(git rev-parse HEAD)" \
            --tag-sha "$TAG_COMMIT"

          IMMUTABLE_ENABLED="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq '.enabled')"
          if [ "$IMMUTABLE_ENABLED" != "true" ]; then
            echo "::error::GitHub immutable releases must be enabled before a formal tag is published."
            exit 1
          fi

          release_status="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")"
          case "$release_status" in
            404) ;;
            200)
              echo "::error::Release $VERSION already exists and is frozen. Publish a new version."
              exit 1
              ;;
            *)
              cat /tmp/release.json >&2
              echo "::error::Could not prove that Release $VERSION is absent (HTTP $release_status)."
              exit 1
              ;;
          esac

          dockerhub_settings="$(curl --fail-with-body --silent --show-error \
            https://hub.docker.com/v2/repositories/aethersailor/subconverter-extended/)"
          python3 - "$VERSION" "$dockerhub_settings" <<'PY'
          import json
          import re
          import sys

          version, raw = sys.argv[1:]
          settings = json.loads(raw).get("immutable_tags_settings") or {}
          rules = settings.get("rules") or []
          if settings.get("enabled") is not True:
              raise SystemExit("::error::Docker Hub immutable tags must be enabled before release.")
          if not any(re.fullmatch(rule, version) for rule in rules):
              raise SystemExit(
                  f"::error::Docker Hub immutable rules do not protect {version}: {rules}"
              )
          PY

          assert_registry_tag_absent() {
            local registry="$1"
            local repository="$2"
            local token_url="$3"
            local token
            local status
            token="$(curl --fail-with-body --silent --show-error "$token_url" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            status="$(curl -sS -o /tmp/registry-manifest -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://$registry/v2/$repository/manifests/$VERSION")"
            case "$status" in
              404) ;;
              200)
                echo "::error::$registry/$repository:$VERSION already exists and must not be overwritten."
                exit 1
                ;;
              *)
                cat /tmp/registry-manifest >&2
                echo "::error::Could not prove $registry/$repository:$VERSION is absent (HTTP $status)."
                exit 1
                ;;
            esac
          }

          assert_registry_tag_absent \
            registry-1.docker.io \
            aethersailor/subconverter-extended \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:aethersailor/subconverter-extended:pull"
          assert_registry_tag_absent \
            ghcr.io \
            aethersailor/subconverter-extended \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:aethersailor/subconverter-extended:pull"

      - name: Verify COCR runtime assets are absent
        shell: bash
        run: |
          set -euo pipefail
          if [ -e base/Custom_OpenClash_Rules ] || \
             git ls-files -- base/Custom_OpenClash_Rules | grep -q .; then
            echo "::error::Custom_OpenClash_Rules runtime assets must not exist in this project."
            exit 1
          fi

      - name: Refresh dependency snapshot on dev
        if: steps.metadata.outputs.mode == 'dev'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/dependency_snapshot.py refresh

      - name: Validate dependency snapshot
        shell: bash
        run: python3 scripts/ci/dependency_snapshot.py check

      - name: Export dependency metadata
        id: dependencies
        shell: bash
        run: |
          python3 scripts/ci/dependency_snapshot.py emit \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Summarize dependency snapshot
        shell: bash
        run: |
          {
            echo "### Dependency snapshot"
            echo
            echo "Mode: \`${{ steps.metadata.outputs.mode }}\`"
            echo "Snapshot SHA-256: \`${{ steps.dependencies.outputs.dependency_snapshot_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-snapshot
          path: scripts/ci/dependencies.lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Build Linux matrix
        id: linux_matrix
        shell: bash
        run: |
          python3 scripts/ci/build_plan.py matrix \
            --mode "${{ steps.metadata.outputs.mode }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          MODE: ${{ steps.metadata.outputs.mode }}
        run: |
          python3 scripts/ci/build_plan.py tags \
            --mode "$MODE" \
            --version "$VERSION" \
            --github-output "$GITHUB_OUTPUT"

  build-linux:
    name: "🐳 Docker Build (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.linux_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          fetch-depth: 0

      - name: Download dependency snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-snapshot
          path: dependency-snapshot

      - name: Activate dependency snapshot
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          cp dependency-snapshot/dependencies.lock.json scripts/ci/dependencies.lock.json
          python3 scripts/ci/dependency_snapshot.py check
          python3 scripts/ci/dependency_snapshot.py emit \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Run Python regression baselines
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Docker Buildx
        shell: bash
        run: |
          docker buildx create --name sce-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && needs.prepare.outputs.mode != 'master'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && needs.prepare.outputs.mode != 'master'
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Prepare Docker build args
        id: docker_args
        shell: bash
        env:
          THREADS: ${{ matrix.threads }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          REFRESH_GO_DEPS: ${{ needs.prepare.outputs.mode == 'dev' && matrix.extract_generated == 'true' }}
          REFRESH_HEADERS: ${{ needs.prepare.outputs.mode == 'dev' && matrix.extract_generated == 'true' }}
        run: |
          {
            echo 'args<<EOF'
            bash scripts/ci/docker-build-args.sh
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build candidate image once
        id: build_image
        shell: bash
        env:
          BUILD_ARGS: ${{ steps.docker_args.outputs.args }}
        run: |
          bash scripts/ci/build-candidate-image.sh \
            "${{ matrix.arch }}" \
            "${{ matrix.dockerfile }}" \
            "${{ matrix.image_platform }}" \
            "${{ matrix.cache_scope }}" \
            "${{ github.event_name }}" \
            "${{ needs.prepare.outputs.mode }}" \
            "${{ needs.prepare.outputs.version }}"

      - name: Export CI artifacts from the existing cache
        shell: bash
        env:
          BUILD_ARGS: ${{ steps.docker_args.outputs.args }}
        run: |
          bash scripts/ci/export-ci-image.sh \
            "${{ matrix.dockerfile }}" \
            "${{ matrix.builder_tag }}" \
            "${{ matrix.builder_platform }}"

      - name: Extract builder output
        shell: bash
        env:
          EXTRACT_GENERATED: ${{ matrix.extract_generated }}
        run: bash scripts/ci/extract-builder-output.sh "${{ matrix.builder_tag }}" "${{ matrix.extract_mode }}"

      - name: Check bridge size budget (${{ matrix.arch }})
        shell: bash
        run: python3 scripts/ci/check_file_size.py --budget "${{ matrix.bridge_budget }}" "build/bridge-output/libmihomo.*"

      - name: Package Release Artifacts (Linux ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: bash scripts/ci/build-linux-release.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.arch }}" "${{ matrix.openwrt_arches }}"

      - name: Check release size budgets (Linux ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        shell: bash
        run: |
          python3 scripts/ci/check_file_size.py --budget release-linux \
            "SubConverter-Extended-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz"
          python3 scripts/ci/check_file_size.py --budget release-openwrt \
            "SubConverter-Extended-${{ needs.prepare.outputs.version }}-openwrt-*.apk"

      - name: Set up QEMU for smoke test
        if: matrix.qemu_platforms != ''
        shell: bash
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install "${{ matrix.qemu_platforms }}"

      - name: Smoke test artifact (Linux ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        timeout-minutes: 3
        uses: ./.github/actions/smoke-linux-artifact
        with:
          artifact: SubConverter-Extended-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          expected-version: ${{ needs.prepare.outputs.version }}
          expected-revision: ${{ needs.prepare.outputs.sha }}
          expected-build-date: ${{ needs.prepare.outputs.build_date }}

      - name: Smoke test APKs (OpenWrt ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        timeout-minutes: 3
        uses: ./.github/actions/smoke-openwrt-apk
        with:
          artifacts: SubConverter-Extended-${{ needs.prepare.outputs.version }}-openwrt-*.apk
          expected-version: ${{ needs.prepare.outputs.version }}
          expected-revision: ${{ needs.prepare.outputs.sha }}
          expected-build-date: ${{ needs.prepare.outputs.build_date }}

      - name: Upload Artifact (Linux ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-${{ matrix.arch }}
          path: SubConverter-Extended-*.tar.gz

      - name: Upload Artifact (OpenWrt ${{ matrix.arch }})
        if: needs.prepare.outputs.is_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openwrt-${{ matrix.arch }}
          path: SubConverter-Extended-*-openwrt-*.apk

      - name: Clean release packaging files
        if: needs.prepare.outputs.is_release == 'true'
        shell: bash
        run: rm -rf SubConverter-Extended SubConverter-Extended-*.tar.gz SubConverter-Extended-*.apk subconverter runtime-libs runtime-root libmihomo.so build/openwrt-apk

      - name: Check for file changes
        id: check_changes
        if: matrix.extract_generated == 'true'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- scripts/ci/dependencies.lock.json bridge/go.mod bridge/go.sum bridge/libmihomo.h bridge/proxy_validation_generated.go src/parser/mihomo_schemes.h src/parser/param_compat.h include/httplib.h include/nlohmann/json.hpp include/inja.hpp include/jpcre2.hpp include/quickjspp.hpp include/libcron include/date include/toml.hpp include/toml11)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify frozen generated inputs outside dev
        if: steps.check_changes.outputs.changed == 'true' && needs.prepare.outputs.mode != 'dev'
        shell: bash
        run: |
          git status --short -- scripts/ci/dependencies.lock.json bridge/go.mod bridge/go.sum bridge/libmihomo.h bridge/proxy_validation_generated.go src/parser/mihomo_schemes.h src/parser/param_compat.h include/httplib.h include/nlohmann/json.hpp include/inja.hpp include/jpcre2.hpp include/quickjspp.hpp include/libcron include/date include/toml.hpp include/toml11
          echo "::error::Frozen dependency/generated inputs are stale. Refresh and commit them on dev before building master or a release."
          exit 1

      - name: Save image digest
        if: github.event_name != 'pull_request' && needs.prepare.outputs.mode != 'master'
        shell: bash
        run: |
          mkdir -p docker-digests
          printf '%s\n' "${{ steps.build_image.outputs.digest }}" > "docker-digests/${{ matrix.arch }}.txt"

      - name: Upload image digest
        if: github.event_name != 'pull_request' && needs.prepare.outputs.mode != 'master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: docker-digests/${{ matrix.arch }}.txt
          retention-days: 1

      - name: Smoke test image (${{ matrix.arch }})
        if: github.event_name != 'pull_request' && needs.prepare.outputs.mode != 'master'
        timeout-minutes: 3
        uses: ./.github/actions/smoke-docker-image
        with:
          image: ghcr.io/aethersailor/subconverter-extended@${{ steps.build_image.outputs.digest }}
          platform: ${{ matrix.image_platform }}
          expected-version: ${{ needs.prepare.outputs.version }}
          expected-revision: ${{ needs.prepare.outputs.sha }}
          expected-build-date: ${{ needs.prepare.outputs.build_date }}

      - name: Commit and push generated development files
        if: steps.check_changes.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH_NAME="dev"

          git fetch --no-tags origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          remote_revision="$(git rev-parse "origin/$BRANCH_NAME")"
          if [ "$remote_revision" != "$SOURCE_REVISION" ]; then
            echo "::warning::dev advanced from $SOURCE_REVISION to $remote_revision; skipping stale generated-file writeback."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/dependencies.lock.json bridge/go.mod bridge/go.sum bridge/libmihomo.h bridge/proxy_validation_generated.go src/parser/mihomo_schemes.h src/parser/param_compat.h include/httplib.h include/nlohmann/json.hpp include/inja.hpp include/jpcre2.hpp include/quickjspp.hpp include/libcron include/date include/toml.hpp include/toml11
          git commit -m "chore: update generated development inputs after build [skip ci]"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"

  build-windows-amd64:
    name: "🪟 Windows Build (amd64)"
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.is_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Download dependency snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-snapshot
          path: dependency-snapshot

      - name: Activate dependency snapshot
        shell: pwsh
        run: |
          Copy-Item dependency-snapshot/dependencies.lock.json scripts/ci/dependencies.lock.json -Force
          python scripts/ci/dependency_snapshot.py check
          python scripts/ci/dependency_snapshot.py emit --github-env $env:GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-yaml-cpp
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-rapidjson

      - name: Build Windows amd64
        shell: msys2 {0}
        run: |
          THREADS=4 bash scripts/build-windows-amd64.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.sha }}" \
            "${{ needs.prepare.outputs.build_date }}"

      - name: Package Release Artifact (Windows amd64)
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1 -Version "${{ needs.prepare.outputs.version }}" -Revision "${{ needs.prepare.outputs.sha }}" -BuildDate "${{ needs.prepare.outputs.build_date }}"

      - name: Check release size budget (Windows amd64)
        shell: pwsh
        run: python scripts/ci/check_file_size.py --budget release-windows-amd64 "SubConverter-Extended-${{ needs.prepare.outputs.version }}-windows-amd64.zip"

      - name: Smoke test artifact (Windows amd64)
        timeout-minutes: 3
        uses: ./.github/actions/smoke-windows-artifact
        with:
          artifact: SubConverter-Extended-${{ needs.prepare.outputs.version }}-windows-amd64.zip
          expected-version: ${{ needs.prepare.outputs.version }}
          expected-revision: ${{ needs.prepare.outputs.sha }}
          expected-build-date: ${{ needs.prepare.outputs.build_date }}

      - name: Upload Artifact (Windows amd64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-amd64
          path: SubConverter-Extended-*.zip

  merge-manifest:
    name: "🔗 Publish Version Docker Images"
    runs-on: ubuntu-latest
    needs: [prepare, build-linux]
    if: github.event_name != 'pull_request' && needs.prepare.outputs.mode != 'master'
    outputs:
      dockerhub_digest: ${{ steps.published.outputs.dockerhub_digest }}
      ghcr_digest: ${{ steps.published.outputs.ghcr_digest }}
    steps:
      - name: Prevent stale dev image promotion
        if: needs.prepare.outputs.mode == 'dev'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const sourceSha = process.env.SOURCE_SHA;
            const { data: branchData } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
            });
            const currentSha = branchData.commit.sha;

            if (currentSha === sourceSha) {
              core.info(`${sourceSha} is still the current head of ${branch}.`);
              return;
            }

            const { data: currentCommit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: currentSha,
            });
            const generatedCommitTitle =
              'chore: update generated development inputs after build [skip ci]';
            const isExpectedGeneratedChild =
              currentCommit.parents.length === 1 &&
              currentCommit.parents[0].sha === sourceSha &&
              currentCommit.commit.message.split('\n', 1)[0] === generatedCommitTitle &&
              currentCommit.committer?.login === 'github-actions[bot]';

            if (isExpectedGeneratedChild) {
              core.info(
                `${currentSha} is the expected generated child of ${sourceSha}; ` +
                'promotion remains valid.'
              );
              return;
            }

            core.setFailed(
              `Refusing to promote stale image for ${sourceSha}; ` +
              `${branch} now points to ${currentSha}.`
            );

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Re-verify formal version tags are absent
        if: needs.prepare.outputs.mode == 'release'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          remote_tag_commit="$(git ls-remote \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$VERSION^{}" | awk '{print $1}')"
          if [ "$remote_tag_commit" != "${{ needs.prepare.outputs.sha }}" ]; then
            echo "::error::Remote annotated tag $VERSION no longer peels to the approved source SHA."
            exit 1
          fi
          assert_absent() {
            local registry="$1"
            local repository="$2"
            local token_url="$3"
            local token
            local status
            token="$(curl --fail-with-body --silent --show-error "$token_url" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            status="$(curl -sS -o /tmp/manifest -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://$registry/v2/$repository/manifests/$VERSION")"
            if [ "$status" = "404" ]; then
              return
            fi
            if [ "$status" = "200" ]; then
              echo "::error::$registry/$repository:$VERSION appeared during the build; refusing overwrite."
            else
              echo "::error::Could not re-prove absence of $registry/$repository:$VERSION (HTTP $status)."
            fi
            exit 1
          }
          assert_absent \
            registry-1.docker.io \
            aethersailor/subconverter-extended \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:aethersailor/subconverter-extended:pull"
          assert_absent \
            ghcr.io \
            aethersailor/subconverter-extended \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:aethersailor/subconverter-extended:pull"

      - name: Promote tested candidates
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.prepare.outputs.mode }}" = "dev" ]; then
            ARCHES=(amd64)
          else
            ARCHES=(amd64 arm64 armv7)
          fi
          for arch in "${ARCHES[@]}"; do
            test -s "digests/${arch}.txt"
            grep -Eq '^sha256:[0-9a-f]{64}$' "digests/${arch}.txt"
          done

          TAGS="${{ needs.prepare.outputs.tags }}"
          IMAGE_NAMES=(
            "aethersailor/subconverter-extended"
            "ghcr.io/aethersailor/subconverter-extended"
          )

          for IMAGE_NAME in "${IMAGE_NAMES[@]}"; do
            SOURCES=()
            for arch in "${ARCHES[@]}"; do
              candidate="ci-${{ needs.prepare.outputs.mode }}-${arch}"
              if [ "${{ needs.prepare.outputs.mode }}" = "release" ]; then
                candidate="ci-${{ needs.prepare.outputs.version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
              fi
              SOURCES+=("${IMAGE_NAME}:${candidate}")
            done
            for TAG in $TAGS; do
              if [[ "$TAG" == "$IMAGE_NAME:"* ]]; then
                echo "Promoting ${SOURCES[*]} to $TAG"
                docker buildx imagetools create -t "$TAG" "${SOURCES[@]}"
              fi
            done
          done

      - name: Verify manifest platforms
        id: published
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.prepare.outputs.mode }}" = "dev" ]; then
            PLATFORMS=("linux/amd64")
          else
            PLATFORMS=("linux/amd64" "linux/arm64" "linux/arm/v7")
          fi
          TAGS="${{ needs.prepare.outputs.tags }}"
          DOCKERHUB_DIGEST=""
          GHCR_DIGEST=""
          for TAG in $TAGS; do
            echo "Inspecting $TAG"
            for attempt in $(seq 1 6); do
              if docker buildx imagetools inspect "$TAG" > manifest.txt; then
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "Failed to inspect $TAG"
                exit 1
              fi
              sleep 5
            done

            cat manifest.txt
            digest="$(awk '$1 == "Digest:" {print $2; exit}' manifest.txt)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not resolve the manifest digest for $TAG."
              exit 1
            fi
            if [[ "$TAG" == ghcr.io/* ]]; then
              GHCR_DIGEST="$digest"
              echo "ghcr_digest=$digest" >> "$GITHUB_OUTPUT"
            else
              DOCKERHUB_DIGEST="$digest"
              echo "dockerhub_digest=$digest" >> "$GITHUB_OUTPUT"
            fi

            for PLATFORM in "${PLATFORMS[@]}"; do
              if ! grep -Eq "Platform:[[:space:]]+${PLATFORM}$" manifest.txt; then
                echo "Missing platform ${PLATFORM} in ${TAG}"
                exit 1
              fi
              docker pull --platform "$PLATFORM" "$TAG"
              actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$TAG")"
              actual_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$TAG")"
              test "$actual_revision" = "${{ needs.prepare.outputs.sha }}"
              test "$actual_version" = "${{ needs.prepare.outputs.version }}"
            done
          done
          test -n "$DOCKERHUB_DIGEST"
          test -n "$GHCR_DIGEST"
          if [ "$DOCKERHUB_DIGEST" != "$GHCR_DIGEST" ]; then
            echo "::error::Docker Hub and GHCR manifest digests differ."
            exit 1
          fi

  create-release:
    name: "🚀 Release Artifacts"
    runs-on: ubuntu-latest
    needs: [prepare, build-linux, build-windows-amd64, merge-manifest]
    if: startsWith(github.ref, 'refs/tags/') && needs.prepare.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Prepare Release Notes Context
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          CURRENT_TAG="$RELEASE_VERSION"
          CURRENT_COMMIT="$(git rev-list -n 1 "$CURRENT_TAG")"
          test "$CURRENT_COMMIT" = "${{ needs.prepare.outputs.sha }}"
          REMOTE_COMMIT="$(git ls-remote origin "refs/tags/$CURRENT_TAG^{}" | awk '{print $1}')"
          test "$REMOTE_COMMIT" = "$CURRENT_COMMIT"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${CURRENT_COMMIT}^" 2>/dev/null || true)"
          EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE_LABEL="$PREVIOUS_TAG..$CURRENT_COMMIT"
            git log --pretty=format:'- %h %s' "$PREVIOUS_TAG..$CURRENT_COMMIT" > commits.md
            git diff --name-only "$PREVIOUS_TAG" "$CURRENT_COMMIT" > changed-files.md
            git diff --stat "$PREVIOUS_TAG" "$CURRENT_COMMIT" > diffstat.md
          else
            RANGE_LABEL="$CURRENT_COMMIT"
            git log --pretty=format:'- %h %s' "$CURRENT_COMMIT" > commits.md
            git diff --name-only "$EMPTY_TREE" "$CURRENT_COMMIT^{tree}" > changed-files.md
            git diff --stat "$EMPTY_TREE" "$CURRENT_COMMIT^{tree}" > diffstat.md
          fi

          {
            echo "# Release Context"
            echo
            echo "Current tag: $CURRENT_TAG"
            echo "Current commit: $CURRENT_COMMIT"
            echo "Previous tag: ${PREVIOUS_TAG:-none}"
            echo "Range: $RANGE_LABEL"
            echo
            echo "## Commits"
            cat commits.md
            echo
            echo
            echo "## Changed files"
            sed 's/^/- /' changed-files.md
            echo
            echo
            echo "## Diff stat"
            cat diffstat.md
          } > release-context.md

          {
            echo "## English"
            echo
            echo "### Changes"
            if [ -s commits.md ]; then
              cat commits.md
            else
              echo "- No commit summary was available."
            fi
            echo
            echo "## 中文"
            echo
            echo "### 变更"
            echo "本次发布包含以下提交："
            if [ -s commits.md ]; then
              cat commits.md
            else
              echo "- 未获取到提交摘要。"
            fi
          } > release-notes.fallback.md

      - name: Check Copilot Token
        id: copilot_token
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.copilot_token.outputs.available == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6

      - name: Generate Bilingual Release Notes with Copilot
        if: steps.copilot_token.outputs.available == 'true'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          npm install -g @github/copilot@1.0.70

          PROMPT="$(cat <<'EOF'
          You are writing release notes for SubConverter-Extended.

          Use only the release context provided below. Do not invent features, fixes, platforms, or compatibility claims.
          Summarize user-visible changes first. Mention maintenance or dependency changes only when relevant.
          Ignore auto-generated files unless the context shows they affect users.

          Return only Markdown. Do not wrap the answer in a code fence.
          Do not include a downloads section; it will be appended by the workflow.

          Required format:

          ## English

          ### Highlights
          - ...

          ### Changes
          - ...

          ## 中文

          ### 亮点
          - ...

          ### 变更
          - ...

          Omit empty sections. Keep each language concise and accurate.
          EOF
          )"

          PROMPT="$PROMPT

          $(cat release-context.md)"

          copilot -p "$PROMPT" --no-ask-user > release-notes.ai.md
          grep -q '[[:alnum:]]' release-notes.ai.md

      - name: Assemble Release Notes
        run: |
          set -euo pipefail

          if [ -s release-notes.ai.md ]; then
            cp release-notes.ai.md release-notes.md
            echo "Using Copilot-generated release notes."
          else
            cp release-notes.fallback.md release-notes.md
            echo "Using fallback release notes."
          fi

          cat >> release-notes.md <<'EOF'

          ## Docker Images

          Docker images are published to:
          - `aethersailor/subconverter-extended`
          - `ghcr.io/aethersailor/subconverter-extended`

          Supported Docker platforms:
          - `linux/amd64`
          - `linux/arm64`
          - `linux/arm/v7`

          ## Downloads

          ### Linux (portable, glibc runtime bundled)
          - **amd64**: `SubConverter-Extended-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz`
          - **arm64**: `SubConverter-Extended-${{ needs.prepare.outputs.version }}-linux-arm64.tar.gz`
          - **armv7**: `SubConverter-Extended-${{ needs.prepare.outputs.version }}-linux-armv7.tar.gz`

          ### Windows (portable)
          - **amd64**: `SubConverter-Extended-${{ needs.prepare.outputs.version }}-windows-amd64.zip`

          ### OpenWrt 25.12+ APK (unsigned)
          Install with `apk add --allow-untrusted ./<package>.apk`. Choose the APK whose OpenWrt architecture suffix matches `apk print-arch`.
          User configuration is created at `/etc/subconverter/pref.toml` on first start and is not overwritten by upgrades.
          - **x86_64**: `SubConverter-Extended-${{ needs.prepare.outputs.version }}-openwrt-x86_64.apk`
          - **aarch64**: `SubConverter-Extended-${{ needs.prepare.outputs.version }}-openwrt-aarch64_generic.apk`, `...-aarch64_cortex-a53.apk`, `...-aarch64_cortex-a72.apk`
          - **armv7**: `SubConverter-Extended-${{ needs.prepare.outputs.version }}-openwrt-arm_cortex-*.apk`

          ### Checksums
          - `SHA256SUMS`
          EOF

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: false

      - name: Generate checksums
        run: |
          set -euo pipefail

          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' \) -print | sort | while read -r file; do
            sha256sum "$file" | sed 's#  artifacts/[^/]*/#  #'
          done > SHA256SUMS

          cat SHA256SUMS
          duplicate_names="$(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' \) -printf '%f\n' | sort | uniq -d)"
          if [ -n "$duplicate_names" ]; then
            echo "::error::Duplicate release asset names: $duplicate_names"
            exit 1
          fi
          mkdir release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' \) \
            -exec cp '{}' release-assets/ \;
          cp SHA256SUMS release-assets/SHA256SUMS

      - name: Generate immutable release manifest
        shell: bash
        run: |
          python3 scripts/ci/release_manifest.py build \
            --root release-assets \
            --output release-assets/RELEASE-MANIFEST.json \
            --version "${{ needs.prepare.outputs.version }}" \
            --revision "${{ needs.prepare.outputs.sha }}" \
            --build-date "${{ needs.prepare.outputs.build_date }}" \
            --dockerhub-digest "${{ needs.merge-manifest.outputs.dockerhub_digest }}" \
            --ghcr-digest "${{ needs.merge-manifest.outputs.ghcr_digest }}"
          python3 scripts/ci/release_manifest.py verify \
            --root release-assets \
            --manifest release-assets/RELEASE-MANIFEST.json

      - name: Create draft Release without overwrites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$VERSION" \
            --notes-file release-notes.md

  finalize-release:
    name: "🔒 Freeze Release and Advance latest"
    runs-on: ubuntu-latest
    needs: [prepare, merge-manifest, create-release]
    if: startsWith(github.ref, 'refs/tags/') && needs.prepare.outputs.is_release == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Re-verify draft assets and tag identity
        id: release_assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(git rev-list -n 1 "$VERSION")" = "$REVISION"
          test "$(git ls-remote origin "refs/tags/$VERSION^{}" | awk '{print $1}')" = "$REVISION"
          release_state="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
            --jq '[.draft, .immutable] | @tsv')"
          if [ "$release_state" = $'true\tfalse' ]; then
            echo "publish_needed=true" >> "$GITHUB_OUTPUT"
          elif [ "$release_state" = $'false\ttrue' ]; then
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release $VERSION is neither a mutable draft nor an immutable publication: $release_state"
            exit 1
          fi

          mkdir verified-assets
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir verified-assets
          python3 scripts/ci/release_manifest.py verify \
            --root verified-assets \
            --manifest verified-assets/RELEASE-MANIFEST.json

          python3 - "$REVISION" "${{ needs.merge-manifest.outputs.dockerhub_digest }}" "${{ needs.merge-manifest.outputs.ghcr_digest }}" <<'PY'
          import json
          import sys

          revision, dockerhub_digest, ghcr_digest = sys.argv[1:]
          manifest = json.load(open("verified-assets/RELEASE-MANIFEST.json", encoding="utf-8"))
          if manifest["revision"] != revision:
              raise SystemExit("release manifest revision changed")
          if manifest["images"]["dockerhub"]["digest"] != dockerhub_digest:
              raise SystemExit("Docker Hub digest changed")
          if manifest["images"]["ghcr"]["digest"] != ghcr_digest:
              raise SystemExit("GHCR digest changed")
          PY

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Re-verify published version digests
        id: version_images
        shell: bash
        run: |
          set -euo pipefail
          inspect_digest() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" {print $2; exit}'
          }
          test "$(inspect_digest "aethersailor/subconverter-extended:${{ needs.prepare.outputs.version }}")" = "${{ needs.merge-manifest.outputs.dockerhub_digest }}"
          test "$(inspect_digest "ghcr.io/aethersailor/subconverter-extended:${{ needs.prepare.outputs.version }}")" = "${{ needs.merge-manifest.outputs.ghcr_digest }}"
          dockerhub_latest="$(inspect_digest aethersailor/subconverter-extended:latest)"
          ghcr_latest="$(inspect_digest ghcr.io/aethersailor/subconverter-extended:latest)"
          [[ "$dockerhub_latest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ghcr_latest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "dockerhub_latest=$dockerhub_latest" >> "$GITHUB_OUTPUT"
          echo "ghcr_latest=$ghcr_latest" >> "$GITHUB_OUTPUT"

      - name: Publish immutable GitHub Release
        if: steps.release_assets.outputs.publish_needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          for attempt in $(seq 1 6); do
            immutable="$(gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
              --jq '.immutable')"
            [ "$immutable" = "true" ] && exit 0
            [ "$attempt" -eq 6 ] && break
            sleep 2
          done
          echo "::error::Published Release $VERSION did not become immutable."
          exit 1

      - name: Verify GitHub release attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            if gh release verify "$VERSION" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            [ "$attempt" -eq 6 ] && break
            sleep 2
          done
          echo "::error::GitHub release attestation verification failed for $VERSION."
          exit 1

      - name: Advance latest only after full release verification
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          inspect_digest() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" {print $2; exit}'
          }
          OLD_DOCKERHUB="${{ steps.version_images.outputs.dockerhub_latest }}"
          OLD_GHCR="${{ steps.version_images.outputs.ghcr_latest }}"
          test "$(inspect_digest aethersailor/subconverter-extended:latest)" = "$OLD_DOCKERHUB"
          test "$(inspect_digest ghcr.io/aethersailor/subconverter-extended:latest)" = "$OLD_GHCR"

          rollback_latest() {
            echo "::warning::Restoring the pre-release latest pointers after a promotion failure."
            docker buildx imagetools create \
              -t aethersailor/subconverter-extended:latest \
              "aethersailor/subconverter-extended@$OLD_DOCKERHUB" || true
            docker buildx imagetools create \
              -t ghcr.io/aethersailor/subconverter-extended:latest \
              "ghcr.io/aethersailor/subconverter-extended@$OLD_GHCR" || true
          }

          if ! docker buildx imagetools create \
            -t aethersailor/subconverter-extended:latest \
            "aethersailor/subconverter-extended:$VERSION"; then
            rollback_latest
            exit 1
          fi
          if ! docker buildx imagetools create \
            -t ghcr.io/aethersailor/subconverter-extended:latest \
            "ghcr.io/aethersailor/subconverter-extended:$VERSION"; then
            rollback_latest
            exit 1
          fi

          if [ "$(inspect_digest aethersailor/subconverter-extended:latest)" != "${{ needs.merge-manifest.outputs.dockerhub_digest }}" ] || \
             [ "$(inspect_digest ghcr.io/aethersailor/subconverter-extended:latest)" != "${{ needs.merge-manifest.outputs.ghcr_digest }}" ]; then
            rollback_latest
            echo "::error::latest digest verification failed."
            exit 1
          fi
