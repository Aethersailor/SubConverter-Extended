name: Cleanup Failed Workflows

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Delete Failed, Cancelled and Skipped Workflow Runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "🧹 Cleaning up failed, cancelled and skipped workflow runs..."
          
          # Get all workflow runs and delete them
          gh api "repos/$REPOSITORY/actions/runs" \
            --paginate \
            -q '.workflow_runs[] | select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="skipped") | .id' \
            | while read -r run_id; do
              echo "🗑️  Deleting run ID: $run_id"
              gh api "repos/$REPOSITORY/actions/runs/$run_id" -X DELETE || echo "   ⚠️  Failed to delete $run_id"
            done
          
          echo ""
          echo "✅ Cleanup completed!"
