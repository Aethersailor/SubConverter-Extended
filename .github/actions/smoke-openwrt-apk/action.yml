name: Smoke test OpenWrt APK artifacts
description: Verify that OpenWrt APK artifacts install into an apk root.

inputs:
  artifacts:
    description: Shell glob matching APK artifacts.
    required: true
  expected-version:
    description: Exact formal vX.Y.Z identity.
    required: true
  expected-revision:
    description: Exact full tag commit SHA.
    required: true
  expected-build-date:
    description: Exact canonical UTC build timestamp.
    required: true

runs:
  using: composite
  steps:
    - name: Install APKs into apk roots
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob

        artifacts=( ${{ inputs.artifacts }} )
        if [ "${#artifacts[@]}" -eq 0 ]; then
          echo "No APK artifacts matched: ${{ inputs.artifacts }}" >&2
          exit 1
        fi

        for artifact in "${artifacts[@]}"; do
          file="$(basename "$artifact")"
          arch="${file%.apk}"
          arch="${arch##*-openwrt-}"

            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              -e "APK_ARTIFACT=$artifact" \
              -e "OPENWRT_ARCH=$arch" \
              -e "EXPECTED_VERSION=${{ inputs.expected-version }}" \
              -e "EXPECTED_REVISION=${{ inputs.expected-revision }}" \
              -e "EXPECTED_BUILD_DATE=${{ inputs.expected-build-date }}" \
              mirror.gcr.io/library/alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b \
              sh -ec '
              apk add --root /tmp/apk-root --initdb --arch "$OPENWRT_ARCH" --allow-untrusted "/work/$APK_ARTIFACT"
              test -x /tmp/apk-root/usr/bin/subconverter-extended
              test -x /tmp/apk-root/etc/init.d/subconverter-extended
              test -d /tmp/apk-root/etc/subconverter
              test -x /tmp/apk-root/opt/subconverter-extended/subconverter
              test -f /tmp/apk-root/opt/subconverter-extended/base/pref.example.toml
              test ! -e /tmp/apk-root/opt/subconverter-extended/base/Custom_OpenClash_Rules
              test -f /tmp/apk-root/usr/share/doc/subconverter-extended/README.OpenWrt
              test -f /tmp/apk-root/opt/subconverter-extended/BUILD-INFO.json
              grep -Fq "\"version\": \"$EXPECTED_VERSION\"" /tmp/apk-root/opt/subconverter-extended/BUILD-INFO.json
              grep -Fq "\"revision\": \"$EXPECTED_REVISION\"" /tmp/apk-root/opt/subconverter-extended/BUILD-INFO.json
              grep -Fq "\"build_date\": \"$EXPECTED_BUILD_DATE\"" /tmp/apk-root/opt/subconverter-extended/BUILD-INFO.json
              grep -q "/etc/subconverter/pref.toml" /tmp/apk-root/usr/share/doc/subconverter-extended/README.OpenWrt
              grep -q "CONFIG_DIR=\"/etc/subconverter\"" /tmp/apk-root/usr/bin/subconverter-extended
              unexpected_owner="$(
                find \
                  /tmp/apk-root/etc/init.d/subconverter-extended \
                  /tmp/apk-root/usr/bin/subconverter-extended \
                  /tmp/apk-root/etc/subconverter \
                  /tmp/apk-root/opt/subconverter-extended \
                  /tmp/apk-root/usr/share/doc/subconverter-extended \
                  -exec stat -c "%u:%g %n" {} \; |
                  awk "\$1 != \"0:0\" { print; exit }"
              )"
              if [ -n "$unexpected_owner" ]; then
                echo "APK contains a path not owned by root:root: $unexpected_owner" >&2
                exit 1
              fi
              apk info --root /tmp/apk-root subconverter-extended
            '
        done
