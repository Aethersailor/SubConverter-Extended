name: Smoke test Windows portable artifact
description: Extract a Windows release artifact and verify that the HTTP endpoint responds.

inputs:
  artifact:
    description: Path to the zip artifact.
    required: true
  port:
    description: Port used for the smoke test.
    required: false
    default: "25500"
  expected-version:
    description: Exact formal vX.Y.Z identity.
    required: true
  expected-revision:
    description: Exact full tag commit SHA.
    required: true
  expected-build-date:
    description: Exact canonical UTC build timestamp.
    required: true

runs:
  using: composite
  steps:
    - name: Run artifact and check /version
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $artifact = "${{ inputs.artifact }}"
        $port = "${{ inputs.port }}"
        $workDir = Join-Path $env:RUNNER_TEMP ("subconverter-windows-" + [guid]::NewGuid().ToString("N"))
        New-Item -ItemType Directory -Path $workDir | Out-Null

        try {
          Expand-Archive -Path $artifact -DestinationPath $workDir -Force
          $root = Join-Path $workDir "SubConverter-Extended"
          $pref = Join-Path $root "base\pref.toml"
          $stdout = Join-Path $workDir "stdout.log"
          $stderr = Join-Path $workDir "stderr.log"

          if (Test-Path (Join-Path $root "base\Custom_OpenClash_Rules")) {
            throw "Windows artifact still contains removed Custom_OpenClash_Rules assets."
          }
          foreach ($required in @(
            "subconverter-update.exe",
            "update.ps1",
            "update.bat",
            "UPDATE-README.txt"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $required) -PathType Leaf)) {
              throw "Windows artifact is missing $required."
            }
          }

          python "$env:GITHUB_WORKSPACE\scripts\ci\write_build_info.py" verify `
            --path (Join-Path $root "BUILD-INFO.json") `
            --version "${{ inputs.expected-version }}" `
            --revision "${{ inputs.expected-revision }}" `
            --build-date "${{ inputs.expected-build-date }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows package identity verification failed."
          }
          $statusPath = Join-Path $workDir "update-status.json"
          & pwsh -NoProfile -ExecutionPolicy Bypass `
            -File (Join-Path $root "update.ps1") status | Set-Content -LiteralPath $statusPath
          if ($LASTEXITCODE -ne 0) {
            throw "Windows updater status command failed."
          }
          $updateStatus = Get-Content -LiteralPath $statusPath -Raw | ConvertFrom-Json
          if ($updateStatus.state -cne "idle" -or
              $updateStatus.current_version -cne "${{ inputs.expected-version }}" -or
              $updateStatus.rollback_available -or
              $updateStatus.available) {
            throw "Unexpected Windows updater status: $($updateStatus | ConvertTo-Json -Compress)"
          }

          Remove-Item (Join-Path $root "base\pref.toml") -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $root "base\pref.yml") -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $root "base\pref.ini") -ErrorAction SilentlyContinue

          $previousPort = $env:PORT
          $previousPath = $env:PATH
          $previousSkipAutoUpdate = $env:SUBCONVERTER_SKIP_AUTO_UPDATE
          $env:PORT = $port
          $env:PATH = "$root;$env:PATH"
          $env:SUBCONVERTER_SKIP_AUTO_UPDATE = "1"

          $process = Start-Process `
            -FilePath "pwsh" `
            -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", (Join-Path $root "start.ps1")) `
            -WorkingDirectory $root `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          $url = "http://127.0.0.1:$port/version"
          $ok = $false

          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                $response.Content.Substring(0, [Math]::Min(200, $response.Content.Length))
                $ok = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 1
            }

            if ($process.HasExited) {
              break
            }
          }

          if (-not $ok) {
            Write-Host "stdout:"
            if (Test-Path $stdout) { Get-Content $stdout -ErrorAction SilentlyContinue }
            Write-Host "stderr:"
            if (Test-Path $stderr) { Get-Content $stderr -ErrorAction SilentlyContinue }
            throw "Windows artifact smoke test failed."
          }

          $plainResponse = Invoke-WebRequest `
            -UseBasicParsing `
            -Uri $url `
            -Headers @{ Origin = "https://identity-check.invalid" } `
            -TimeoutSec 5
          $expectedBuildId = "${{ inputs.expected-revision }}".Substring(0, 7)
          $expectedPlainVersion = "SubConverter-Extended ${{ inputs.expected-version }}-$expectedBuildId backend"
          if ($plainResponse.Content.TrimEnd("`r", "`n") -cne $expectedPlainVersion) {
            throw "Windows runtime version identity mismatch: '$($plainResponse.Content)'"
          }

          python "$env:GITHUB_WORKSPACE\scripts\run-subconverter-smoke.py" --base-url "http://127.0.0.1:$port"

          # The portable archive deliberately contains no CA bundle. Fetch a
          # pinned HTTPS external config to prove that the packaged OpenSSL
          # libcurl can use the Windows native trust store. Do not import a
          # test root certificate or weaken certificate verification here.
          $caBundle = Join-Path $workDir "etc\ssl\certs\ca-bundle.crt"
          if (Test-Path -LiteralPath $caBundle) {
            throw "Windows artifact smoke unexpectedly found a relocated CA bundle."
          }
          $subscription = [uri]::EscapeDataString(
            "ss://YWVzLTEyOC1nY206cGFzc3dvcmQ@example.com:8388#NativeCA"
          )
          $externalConfig = [uri]::EscapeDataString(
            "https://raw.githubusercontent.com/Aethersailor/SubConverter-Extended/3bc7f09aeeafe4c823b47723915d039d064c4b67/base/config/example_external_config.toml"
          )
          $nativeCaResponse = Invoke-WebRequest `
            -UseBasicParsing `
            -SkipHttpErrorCheck `
            -Uri "http://127.0.0.1:$port/sub?target=clash&url=$subscription&config=$externalConfig" `
            -TimeoutSec 30
          if ($nativeCaResponse.StatusCode -ne 200 -or
              -not $nativeCaResponse.Content.Contains("NativeCA")) {
            throw "Windows native CA smoke returned HTTP $($nativeCaResponse.StatusCode)."
          }

          $removedRoute = Invoke-WebRequest `
            -UseBasicParsing `
            -SkipHttpErrorCheck `
            -Uri "http://127.0.0.1:$port/Custom_OpenClash_Rules/main/rule/example.yaml" `
            -TimeoutSec 5
          if ($removedRoute.StatusCode -ne 404) {
            throw "Removed Custom_OpenClash_Rules route returned HTTP $($removedRoute.StatusCode)."
          }

          if (-not (Test-Path $pref)) {
            throw "Windows launcher did not create base\pref.toml on first start."
          }
        } finally {
          if ($process -and -not $process.HasExited) {
            $process.Kill()
            $process.WaitForExit()
          }
          Get-CimInstance Win32_Process -Filter "name = 'subconverter.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($root, [System.StringComparison]::OrdinalIgnoreCase) } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          if ($null -ne $previousPort) { $env:PORT = $previousPort } else { Remove-Item Env:PORT -ErrorAction SilentlyContinue }
          if ($null -ne $previousPath) { $env:PATH = $previousPath }
          if ($null -ne $previousSkipAutoUpdate) {
            $env:SUBCONVERTER_SKIP_AUTO_UPDATE = $previousSkipAutoUpdate
          } else {
            Remove-Item Env:SUBCONVERTER_SKIP_AUTO_UPDATE -ErrorAction SilentlyContinue
          }
          Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue
        }
