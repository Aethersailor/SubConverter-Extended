name: Smoke test Linux portable artifact
description: Extract a Linux release artifact and verify that the HTTP endpoint responds.

inputs:
  artifact:
    description: Path to the tar.gz artifact.
    required: true
  port:
    description: Port used for the smoke test.
    required: false
    default: "25500"
  expected-version:
    description: Exact formal vX.Y.Z identity.
    required: true
  expected-revision:
    description: Exact full tag commit SHA.
    required: true
  expected-build-date:
    description: Exact canonical UTC build timestamp.
    required: true

runs:
  using: composite
  steps:
    - name: Run artifact and check /version
      shell: bash
      run: |
        set -euo pipefail

        ARTIFACT="${{ inputs.artifact }}"
        PORT="${{ inputs.port }}"
        WORKDIR="$(mktemp -d)"
        PID=""

        cleanup() {
          if [ -n "$PID" ] && kill -0 "$PID" >/dev/null 2>&1; then
            kill "$PID" >/dev/null 2>&1 || true
            wait "$PID" >/dev/null 2>&1 || true
          fi
          rm -rf "$WORKDIR"
        }
        trap cleanup EXIT

        tar -xzf "$ARTIFACT" -C "$WORKDIR"
        cd "$WORKDIR/SubConverter-Extended"
        test ! -e base/Custom_OpenClash_Rules
        test -x subconverter-update
        test -x update.sh
        test -s UPDATE-README.txt
        python3 "$GITHUB_WORKSPACE/scripts/ci/write_build_info.py" verify \
          --path BUILD-INFO.json \
          --version "${{ inputs.expected-version }}" \
          --revision "${{ inputs.expected-revision }}" \
          --build-date "${{ inputs.expected-build-date }}"
        ./update.sh status >"$WORKDIR/update-status.json"
        python3 - "$WORKDIR/update-status.json" "${{ inputs.expected-version }}" <<'PY'
        import json
        import sys

        status = json.load(open(sys.argv[1], encoding="utf-8"))
        if status["state"] != "idle" or status["current_version"] != sys.argv[2]:
            raise SystemExit(f"unexpected portable updater status: {status!r}")
        if status["rollback_available"] or status["available"]:
            raise SystemExit(f"unexpected new-install update state: {status!r}")
        PY

        PORT="$PORT" PREF_PATH="$PWD/base/pref.toml" \
          SUBCONVERTER_SKIP_AUTO_UPDATE=1 \
          ./start.sh >"$WORKDIR/stdout.log" 2>"$WORKDIR/stderr.log" &
        PID="$!"

        URL="http://127.0.0.1:${PORT}/version"
        for _ in $(seq 1 30); do
          if curl -fsS "$URL" >"$WORKDIR/response.out"; then
            head -c 200 "$WORKDIR/response.out"
            python3 "$GITHUB_WORKSPACE/scripts/run-subconverter-smoke.py" --base-url "http://127.0.0.1:${PORT}"
            route_status="$(curl -sS -o /dev/null -w '%{http_code}' \
              "http://127.0.0.1:${PORT}/Custom_OpenClash_Rules/main/rule/example.yaml")"
            test "$route_status" = "404"
            exit 0
          fi

          if ! kill -0 "$PID" >/dev/null 2>&1; then
            cat "$WORKDIR/stdout.log" || true
            cat "$WORKDIR/stderr.log" || true
            exit 1
          fi

          sleep 2
        done

        cat "$WORKDIR/stdout.log" || true
        cat "$WORKDIR/stderr.log" || true
        exit 1
